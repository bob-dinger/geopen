<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Who owns DFW from somewhere else</title>
<meta name="description" content="91,116 parcels across Dallas, Tarrant, Collin and Denton counties whose tax bill is posted outside Texas — $135.7 billion of land, mapped by where the owner gets their mail.">
<link rel="canonical" href="https://geopen.io/maps/dfw-out-of-state-land.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="geopen.io">
<meta property="og:title" content="Who owns DFW from somewhere else">
<meta property="og:description" content="California owns 25,095 parcels of Dallas–Fort Worth worth $26.6 billion — more than the next three states combined.">
<meta property="og:url" content="https://geopen.io/maps/dfw-out-of-state-land.html">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  /* Land, not screens: a warm paper ground with one hot accent for the parcels
     that belong to somebody far away. */
  :root {
    --ground: #14120f; --panel: #1e1b16; --panel-2: #2a251e;
    --rule: rgba(240,230,205,0.15);
    --ink: #f4efe3; --ink-2: #b5aa93; --ink-3: #837a67;
    --signal: #ff8c42;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ground); color: var(--ink);
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  .wrap { flex: 1; min-height: 0; position: relative; }
  #map { position: absolute; inset: 0; }

  .titlecard { position: absolute; left: 16px; top: 16px; z-index: 6; max-width: 330px;
    background: var(--panel); border: 1px solid var(--rule); border-radius: 3px;
    padding: 11px 14px 12px; }
  .titlecard h1 { margin: 0; font-size: 0.98rem; font-weight: 700; line-height: 1.25;
    letter-spacing: -0.01em; text-wrap: balance; }
  .titlecard p { margin: 5px 0 0; font-size: 0.71rem; color: var(--ink-3); line-height: 1.5; }
  .titlecard a { color: var(--ink-2); text-decoration: none; }
  .titlecard a:hover { color: var(--signal); }

  .panel { position: absolute; left: 16px; bottom: 16px; z-index: 5; background: var(--panel);
    border: 1px solid var(--rule); border-radius: 3px; padding: 10px 12px 11px;
    max-width: 232px; max-height: calc(100% - 32px); overflow-y: auto; scrollbar-width: thin; }
  .state { font-size: 0.82rem; font-weight: 700; line-height: 1.3; margin-bottom: 7px; }
  .state b { color: var(--signal); font-variant-numeric: tabular-nums; }
  .state span { display: block; font-size: 0.7rem; font-weight: 400; color: var(--ink-2);
    margin-top: 3px; }
  .state span b { color: var(--signal); }
  h2 { margin: 10px 0 5px; font-size: 0.58rem; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--ink-3); font-weight: 600; }
  .row { display: flex; align-items: center; gap: 6px; padding: 3px 5px; width: 100%;
    border: 0; background: none; font: inherit; font-size: 0.68rem; color: var(--ink-2);
    cursor: pointer; border-radius: 3px; text-align: left; }
  .row i { width: 10px; height: 10px; border-radius: 2px; flex: none; }
  .row b { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 600; }
  .row:hover { color: var(--ink); background: var(--panel-2); }
  .row.on { color: var(--signal); font-weight: 700; background: var(--panel-2);
    box-shadow: inset 0 0 0 1px var(--signal); }
  .hint { margin: 4px 0 0; font-size: 0.58rem; color: var(--ink-3); line-height: 1.45; }
  .clear { background: none; border: 1px solid var(--rule); color: var(--signal);
    border-radius: 3px; font: inherit; font-size: 0.62rem; padding: 3px 8px; cursor: pointer; }
  .bases { display: flex; gap: 4px; flex-wrap: wrap; }
  .bases button { flex: 1 1 44%; background: var(--panel-2); border: 1px solid var(--rule);
    color: var(--ink-2); font: inherit; font-size: 0.65rem; padding: 4px 2px;
    border-radius: 3px; cursor: pointer; }
  .bases button[aria-pressed="true"] { background: var(--signal); border-color: var(--signal);
    color: #241205; font-weight: 700; }

  /* the pinned popup: hover previews, click keeps it open so the links inside
     can actually be reached with the cursor */
  .pinhint { margin-top: 6px; font-size: 0.58rem; color: var(--ink-3);
    font-style: italic; }
  .acts { display: flex; flex-direction: column; gap: 4px; margin-top: 9px;
    padding-top: 8px; border-top: 1px solid rgba(180,160,120,0.28); }
  .acts a { font-size: 0.66rem; color: var(--signal); text-decoration: none;
    padding: 2px 0; }
  .acts a:hover { text-decoration: underline; }
  .acts .acct { margin-top: 3px; font-size: 0.58rem; color: var(--ink-3); }
  .acts .acct code { font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 0.6rem; color: var(--ink-2); user-select: all; }
  .maplibregl-popup.pinned .maplibregl-popup-content { padding-right: 22px; }
  .maplibregl-popup.pinned .maplibregl-popup-close-button {
    font-size: 15px; line-height: 1; padding: 2px 6px; color: var(--ink-3); }
  .maplibregl-popup.pinned .maplibregl-popup-close-button:hover {
    background: none; color: var(--ink); }

  footer { flex: none; padding: 7px 20px 9px; font-size: 0.64rem; color: var(--ink-3);
    line-height: 1.5; }
  footer a { color: var(--ink-2); }
  footer summary { cursor: pointer; list-style: none; display: flex; gap: 7px;
    align-items: baseline; white-space: nowrap; overflow: hidden; }
  footer summary::-webkit-details-marker { display: none; }
  footer summary .src { overflow: hidden; text-overflow: ellipsis; }
  footer summary .more { color: var(--signal); font-weight: 600; flex: none; }
  footer summary .more::after { content: " ▾"; }
  footer details[open] summary .more::after { content: " ▴"; }
  footer .notes { margin-top: 7px; max-height: 32vh; overflow-y: auto; padding-right: 10px;
    border-top: 1px solid var(--rule); padding-top: 7px; }
  footer .notes p { margin: 0 0 6px; }
  footer .notes b { color: var(--ink-2); }
  .maplibregl-popup-content { background: var(--panel-2); color: var(--ink);
    border: 1px solid var(--rule); font-size: 0.76rem; padding: 10px 12px; line-height: 1.5; }
  .maplibregl-popup-content b { color: var(--signal); }
  .maplibregl-popup-tip { border-top-color: var(--panel-2) !important; }
  @media (max-width: 700px) {
    .titlecard { left: 10px; top: 10px; max-width: calc(100% - 20px); }
    .panel { left: 10px; bottom: 10px; max-width: 180px; }
  }
</style>

<div class="wrap">
  <div id="map"></div>
  <div class="titlecard">
    <h1>Who owns Dallas–Fort Worth from somewhere else</h1>
    <p>Every parcel in four counties whose tax bill is posted outside Texas.
      <a href="https://geopen.io/">geopen.io</a></p>
  </div>
  <div class="panel">
    <div class="state" id="state"></div>
    <h2>Where the owner gets mail</h2>
    <div id="legend"></div>
    <p class="hint" id="hint"></p>
    <h2>Basemap</h2>
    <div class="bases" id="bases"></div>
  </div>
</div>

<footer id="foot">Loading…</footer>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3.0.6/dist/pmtiles.js"></script>
<script>
const PM = "https://eazzqlyfcnnlplobgaas.supabase.co/storage/v1/object/public/pmtiles/dfw_out_of_state.pmtiles";
const E = "https://server.arcgisonline.com/ArcGIS/rest/services";
const BASES = [
  { id: "dark", label: "Dark", url: `${E}/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}`,
    ref: `${E}/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}`, opacity: 0.55 },
  { id: "light", label: "Light", url: `${E}/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}`,
    ref: `${E}/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}`, opacity: 1 },
  { id: "topo", label: "Streets", url: `${E}/World_Street_Map/MapServer/tile/{z}/{y}/{x}`,
    ref: null, opacity: 1 },
  { id: "sat", label: "Satellite", url: `${E}/World_Imagery/MapServer/tile/{z}/{y}/{x}`,
    ref: `${E}/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}`, opacity: 1 },
];
let baseKey = "dark", picked = null;

// The states that own enough to be worth their own colour; everything else is
// "other". Checked for separation rather than picked by eye — worst adjacent
// pair 21.4 in normal vision, 12.8 under colour-blind simulation.
const GROUPS = [
  ["CA", "California",   "#ff8c42"],
  ["NY", "New York",     "#e8467c"],
  ["IL", "Illinois",     "#a06cd5"],
  ["FL", "Florida",      "#3bc9db"],
  ["AZ", "Arizona",      "#ffd23f"],
  ["NV", "Nevada",       "#4d9de0"],
  ["GA", "Georgia",      "#7ac74f"],
  ["CO", "Colorado",     "#c1666b"],
  ["FOREIGN", "Outside the US", "#ffffff"],
];
const OTHER = "#8a7f6b";
const usd = (v) => v >= 1e9 ? `$${(v/1e9).toFixed(1)}B` : v >= 1e6 ? `$${Math.round(v/1e6)}M`
  : `$${Math.round(v||0).toLocaleString()}`;
const num = (v) => (v == null ? "—" : Math.round(v).toLocaleString());

document.getElementById("bases").innerHTML = BASES.map((b) =>
  `<button type="button" data-base="${b.id}" aria-pressed="${b.id===baseKey}">${b.label}</button>`).join("");
document.getElementById("bases").addEventListener("click", (e) => {
  const bm = BASES.find((b) => b.id === (e.target.dataset && e.target.dataset.base));
  if (bm) setBase(bm);
});

const map = new maplibregl.Map({
  container: "map",
  style: { version: 8,
    glyphs: "https://protomaps.github.io/basemaps-assets/fonts/{fontstack}/{range}.pbf",
    sources: {
      base: { type: "raster", tileSize: 256, maxzoom: 19, attribution: "© Esri", tiles: [BASES[0].url] },
      ref: { type: "raster", tileSize: 256, maxzoom: 19, tiles: [BASES.find((b)=>b.ref).ref] },
      parcels: { type: "vector", url: "pmtiles://" + PM },
    },
    layers: [{ id: "base", type: "raster", source: "base",
      paint: { "raster-opacity": BASES[0].opacity } }],
  },
  center: [-97.03, 32.82], zoom: 8.6, attributionControl: { compact: true },
});
const protocol = new pmtiles.Protocol();
maplibregl.addProtocol("pmtiles", protocol.tile);
map.addControl(new maplibregl.NavigationControl(), "top-right");
map.addControl(new maplibregl.ScaleControl({ unit: "imperial" }), "bottom-right");
window.__map = map;

function colourExpr() {
  return ["match", ["get", "state"],
    ...GROUPS.flatMap(([k, , c]) => [k, c]), OTHER];
}
function setBase(bm) {
  baseKey = bm.id;
  map.getSource("base").setTiles([bm.url]);
  map.setPaintProperty("base", "raster-opacity", bm.opacity);
  if (bm.ref) map.getSource("ref").setTiles([bm.ref]);
  if (map.getLayer("ref")) map.setLayoutProperty("ref", "visibility", bm.ref ? "visible" : "none");
  // a parcel outline that reads on a dark ground disappears on imagery
  if (map.getLayer("p-line")) {
    map.setPaintProperty("p-line", "line-opacity", bm.id === "sat" ? 0.9 : 0.55);
  }
  document.querySelectorAll("#bases button").forEach((x) =>
    x.setAttribute("aria-pressed", String(x.dataset.base === bm.id)));
}
function applyFilter() {
  const f = picked ? ["==", ["get", "state"], picked] : null;
  for (const id of ["p-fill", "p-line"]) if (map.getLayer(id)) map.setFilter(id, f);
  document.querySelectorAll(".row").forEach((r) =>
    r.classList.toggle("on", picked === r.dataset.k));
  draw();
}
window.pick = (k) => { picked = picked === k ? null : k; applyFilter(); };
window.clearPick = () => { picked = null; applyFilter(); };

let STATS = null;
function draw() {
  if (!STATS) return;
  const rows = STATS.states;
  const sel = picked ? rows.find((r) => r.state === picked) : null;
  const n = sel ? sel.n : STATS.out_of_state;
  const lab = sel ? (GROUPS.find(([k]) => k === picked) || [, picked])[1] : "outside Texas";
  // A dollar total and an acreage total used to sit here. Both were
  // unpublishable: a market value appears on 0.2% of Tarrant's parcels and
  // acreage on 0.1% of Dallas's, so either figure silently omitted a whole
  // county. Ownership concentration can be measured on every parcel, and it is
  // the actual finding — California holds the most land through the most owners,
  // Arizona holds a third as much through a tenth as many.
  const detail = sel
    ? `<b>${num(sel.owners)}</b> owners · top 10 hold <b>${sel.top10_share}%</b>`
    : `${STATS.share_of_classifiable}% of the ${num(STATS.classifiable)} parcels `
      + `whose owner could be traced`;
  document.getElementById("state").innerHTML =
    `<b>${num(n)}</b> parcels owned from ${lab}<span>${detail}</span>`;
  document.getElementById("hint").innerHTML = picked
    ? `<button class="clear" onclick="clearPick()">show every state</button>`
    : "Click a state to show only its parcels. Everything here is land whose tax bill leaves Texas.";
}

map.on("load", () => {
  map.addLayer({ id: "p-fill", type: "fill", source: "parcels", "source-layer": "parcels",
    paint: { "fill-color": colourExpr(), "fill-opacity": 0.75 } });
  map.addLayer({ id: "p-line", type: "line", source: "parcels", "source-layer": "parcels",
    paint: { "line-color": colourExpr(), "line-width": 0.4, "line-opacity": 0.55 } });
  map.addLayer({ id: "ref", type: "raster", source: "ref", paint: { "raster-opacity": 0.8 } });
  setBase(BASES[0]);

  /* Two popups, because a hover tooltip and a set of links cannot be the same
     object: the moment you move the cursor toward a link, mouseleave fires and
     the thing you were reaching for disappears. Hovering previews; clicking
     pins a second popup that stays until dismissed and can be interacted with. */
  const hover = new maplibregl.Popup({
    closeButton: false, closeOnClick: false, maxWidth: "300px" });
  const pinned = new maplibregl.Popup({
    closeButton: true, closeOnClick: false, maxWidth: "330px", className: "pinned" });
  let isPinned = false;
  pinned.on("close", () => { isPinned = false; });

  const esc = (s) => String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
  const g = (q) => "https://www.google.com/search?q=" + encodeURIComponent(q);

  /* Appraisal-district links.
     TxGIO's Prop_ID turns out to BE the appraisal district's own property
     identifier in three of the four counties, so those parcels link straight to
     their record. Confirmed by looking up known-good district URLs in this data
     and finding the same parcel: Denton 982392 is 6105 E McKinney St, Collin
     1354055 is 1102 Howell St, and 93% of Dallas Prop_IDs appear verbatim in
     DCAD's own appraisal export.

     Tarrant is the exception. Its identifier looks like "34345-28-7R" — a legal
     description, not a TAD account number — so it gets the search page and the
     identifier displayed, rather than a URL that would look right and resolve to
     nothing.

     None of these can be checked from a script: all three districts answer
     automated requests with an error page or a 403 while serving real browsers
     normally. They are verified by having been opened in one. */
  const CAD = {
    DALLAS:  { name: "DCAD",       search: "https://www.dallascad.org/SearchAddr.aspx",
               detail: (a) => "https://www.dallascad.org/AcctDetail.aspx?ID=" + encodeURIComponent(a) },
    DENTON:  { name: "Denton CAD", search: "https://www.dentoncad.com/property-search",
               detail: (a) => "https://www.dentoncad.com/property-detail/" + encodeURIComponent(a) },
    COLLIN:  { name: "Collin CAD", search: "https://www.collincad.org/propertysearch",
               detail: (a) => "https://esearch.collincad.org/Property/View/" + encodeURIComponent(a) },
    /* Tarrant has no usable parcel identifier, so instead of the appraisal
       district it gets the County Clerk's real-property index — deeds rather
       than valuations, which for a map about who owns what is arguably the
       better record. It is a party index, so it is searched by owner name; the
       parcel identifier would not resolve there. */
    TARRANT: { name: "Tarrant AD", search: "https://www.tad.org/property-search/",
               deeds: (owner) =>
                 "https://tarrant.tx.publicsearch.us/results?department=RP"
                 + "&recordedDateRange=19000101%2C20991231&searchType=quickSearch"
                 + "&searchValue=" + encodeURIComponent(owner) },
  };

  function body(p, withLinks) {
    const cad = CAD[p.county] || null;
    const addr = (p.situs || "").split(",")[0].trim();
    let h =
      `<b>${esc(p.owner) || "owner not stated"}</b><br>` +
      `${p.situs ? esc(p.situs) + "<br>" : ""}` +
      `<span style="color:#837a67">${esc(p.county)} County</span><br>` +
      `mail goes to <b>${esc(p.mail_city) || "?"}</b>` +
      `${p.state && p.state !== "FOREIGN" ? ", " + esc(p.state) : ""}<br>` +
      `${p.value ? usd(p.value) : "value not stated"}` +
      `${p.acres ? " · " + p.acres.toFixed(2) + " acres" : ""}` +
      `${p.records > 1 ? `<br><span style="color:#837a67">${p.records} records share this parcel</span>` : ""}`;
    if (!withLinks) return h + `<div class="pinhint">click to pin and search</div>`;
    h += `<div class="acts">`;
    if (p.owner) h += `<a href="${g('"' + p.owner + '"')}" target="_blank" rel="noopener">Search this owner ↗</a>`;
    if (addr) h += `<a href="${g(addr + " " + (p.county || "") + " County TX")}" target="_blank" rel="noopener">Search this address ↗</a>`;
    if (cad && cad.detail && p.acct) {
      h += `<a href="${esc(cad.detail(p.acct))}" target="_blank" rel="noopener">${cad.name} record for this parcel ↗</a>`;
    } else if (cad) {
      if (cad.deeds && p.owner) {
        h += `<a href="${esc(cad.deeds(p.owner))}" target="_blank" rel="noopener">County Clerk deed records for this owner ↗</a>`;
      }
      h += `<a href="${cad.search}" target="_blank" rel="noopener">${cad.name} property search ↗</a>`;
    }
    // the account number is shown either way: it is what you paste into a
    // district search that cannot be linked to directly
    if (p.acct) {
      h += `<div class="acct">account <code>${esc(p.acct)}</code>` +
           `${p.accounts > 1 ? ` <span style="color:#837a67">(1 of ${p.accounts} on this parcel)</span>` : ""}</div>`;
    }
    h += `</div>`;
    return h;
  }

  map.on("mousemove", "p-fill", (e) => {
    map.getCanvas().style.cursor = "pointer";
    if (isPinned) return;
    hover.setLngLat(e.lngLat).setHTML(body(e.features[0].properties, false)).addTo(map);
  });
  map.on("mouseleave", "p-fill", () => {
    map.getCanvas().style.cursor = "";
    if (!isPinned) hover.remove();
  });
  map.on("click", "p-fill", (e) => {
    hover.remove();
    isPinned = true;
    pinned.setLngLat(e.lngLat).setHTML(body(e.features[0].properties, true)).addTo(map);
  });

  fetch("/data/dfw_out_of_state_stats.json").then((r) => r.json()).then((s) => {
    STATS = s;
    const top = s.states.slice(0, 10);
    document.getElementById("legend").innerHTML = top.map((r) => {
      const g = GROUPS.find(([k]) => k === r.state);
      const label = g ? g[1] : r.state;
      return `<button class="row" data-k="${r.state}" onclick="pick('${r.state}')">
        <i style="background:${g ? g[2] : OTHER}"></i><span>${label}</span>
        <b>${num(r.n)}</b></button>`;
    }).join("");
    draw();
  });
});

const A = (h, t) => `<a href="${h}" target="_blank" rel="noopener">${t}</a>`;
document.getElementById("foot").innerHTML = `<details><summary>
    <span class="src">Parcels from the ${A("https://data.geographic.texas.gov/",
      "Texas Geographic Information Office")} 2025 statewide file ·
      ${A("https://geopen.io/", "geopen.io")}</span>
    <span class="more">What this counts, and what it misses</span>
  </summary>
  <div class="notes">
    <p><b>This is where the tax bill goes, not where the owner lives.</b> A Texan
      who uses a Delaware LLC or a California management company shows as
      out-of-state; a Californian who uses a Dallas agent shows as Texan. The
      field is a mailing address and nothing more.</p>
    <p><b>Three counties write the state three different ways, and one of them
      lies convincingly.</b> Tarrant leaves the state field blank on all 757,171
      of its parcels and appends it to the city instead — "FORT WORTH, TX".
      Dallas truncates the full state name to five characters: GEORG, CALIF,
      ARIZO. Reading two-letter codes alone gives Dallas County 23 out-of-state
      parcels out of 694,156, which looks like a finding. The state here is read
      from the full mailing address, which spells it out.</p>
    <p><b>It is a floor.</b> Checked against Dallas County's own appraisal roll,
      which has a clean owner-state field: DCAD puts 7.0% of its accounts outside
      Texas where this file puts 3.5% of parcels. Two reasons. The parcel file
      carries one record per physical parcel while the appraisal roll carries one
      per account, so a condo tower is a single parcel here and two hundred
      accounts there — and those units skew heavily to distant owners. And the
      parcel file's mailing fields are blank on about 51,000 Dallas parcels that
      the appraisal roll fills in. Where both sources have data, they agree on
      Texas-or-not <b>94.7%</b> of the time.</p>
    <p><b>Stacked records are collapsed.</b> A condo building or a mobile-home
      park files many records against one shape; drawing them unmerged stacks
      identical polygons and the visible one is whichever draws last. Each shape
      is one feature here, and the popup says how many records share it.</p>
  </div></details>`;
</script>
