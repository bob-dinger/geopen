<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Every Texas police grant your car insurance paid for</title>
<meta name="description" content="All 149 Texas MVCPA grants for 2026 — $51.2 million raised by a $5 fee on every insured vehicle. 39 name cameras or plate readers, and 38 of those sit in the catalytic converter programme.">
<link rel="canonical" href="https://geopen.io/maps/texas-mvcpa-grants.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="geopen.io">
<meta property="og:title" content="Every Texas police grant your car insurance paid for">
<meta property="og:description" content="$51.2m in state motor-vehicle-crime grants, mapped. 38 of the 39 that name cameras sit in the fund the law reserves for catalytic converter theft.">
<meta property="og:url" content="https://geopen.io/maps/texas-mvcpa-grants.html">
<meta property="og:image" content="https://geopen.io/maps/texas-mvcpa-grants-card.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://geopen.io/maps/texas-mvcpa-grants-card.png">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  /* Same cold palette as the plate-reader map — these are two halves of one
     story and should read as a pair. */
  :root {
    --ground: #0c0e11; --panel: #14181d; --panel-2: #1d232a;
    --rule: rgba(200,220,240,0.14);
    --ink: #e9eff5; --ink-2: #9daebe; --ink-3: #6b7d8d;
    --signal: #48e5c2;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ground); color: var(--ink);
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  .wrap { flex: 1; min-height: 0; position: relative; }
  #map { position: absolute; inset: 0; }

  .titlecard { position: absolute; left: 16px; top: 16px; z-index: 6; max-width: 342px;
    background: var(--panel); border: 1px solid var(--rule); border-radius: 3px;
    padding: 11px 14px 12px; }
  .titlecard h1 { margin: 0; font-size: 0.98rem; font-weight: 700; line-height: 1.25;
    letter-spacing: -0.01em; text-wrap: balance; }
  .titlecard p { margin: 5px 0 0; font-size: 0.71rem; color: var(--ink-3); line-height: 1.5; }
  .titlecard a { color: var(--ink-2); text-decoration: none; }
  .titlecard a:hover { color: var(--signal); }

  .panel { position: absolute; left: 16px; bottom: 16px; z-index: 5; background: var(--panel);
    border: 1px solid var(--rule); border-radius: 3px; padding: 10px 12px 11px;
    max-width: 252px; max-height: calc(100% - 32px); overflow-y: auto; scrollbar-width: thin; }
  .state { font-size: 0.82rem; font-weight: 700; line-height: 1.3; margin-bottom: 7px; }
  .state b { color: var(--signal); font-variant-numeric: tabular-nums; }
  .state span { display: block; font-size: 0.7rem; font-weight: 400; color: var(--ink-2);
    margin-top: 3px; }
  h2 { margin: 10px 0 5px; font-size: 0.58rem; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--ink-3); font-weight: 600; }
  h2:first-child { margin-top: 0; }
  .row { display: flex; align-items: center; gap: 6px; padding: 3px 5px; width: 100%;
    border: 0; background: none; font: inherit; font-size: 0.68rem; color: var(--ink-2);
    cursor: pointer; border-radius: 3px; text-align: left; }
  .row i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .row b { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 600; }
  .row:hover { color: var(--ink); background: var(--panel-2); }
  .row.on { color: var(--signal); font-weight: 700; background: var(--panel-2);
    box-shadow: inset 0 0 0 1px var(--signal); }
  .hint { margin: 4px 0 0; font-size: 0.58rem; color: var(--ink-3); line-height: 1.45; }
  .clear { background: none; border: 1px solid var(--rule); color: var(--signal);
    border-radius: 3px; font: inherit; font-size: 0.62rem; padding: 3px 8px; cursor: pointer; }
  .scale { display: flex; align-items: flex-end; gap: 9px; padding: 3px 2px 0; }
  .scale div { text-align: center; color: var(--ink-3); font-size: 0.55rem; }
  .scale span { display: block; margin: 0 auto 3px; border-radius: 50%;
    border: 1px solid var(--signal); background: rgba(72,229,194,0.18); }
  .bases { display: flex; gap: 4px; flex-wrap: wrap; }
  .bases button { flex: 1 1 44%; background: var(--panel-2); border: 1px solid var(--rule);
    color: var(--ink-2); font: inherit; font-size: 0.65rem; padding: 4px 2px;
    border-radius: 3px; cursor: pointer; }
  .bases button[aria-pressed="true"] { background: var(--signal); border-color: var(--signal);
    color: #05221c; font-weight: 700; }
  .controls { margin-top: 11px; padding-top: 9px; border-top: 1px solid var(--rule);
    opacity: 0.75; }
  .controls:hover { opacity: 1; }

  #paneltoggle { display: none; position: absolute; left: 10px; bottom: 10px; z-index: 7;
    align-items: center; gap: 7px; min-height: 36px; padding: 8px 12px;
    background: var(--panel); border: 1px solid var(--rule); border-radius: 3px;
    color: var(--ink-2); font: inherit; font-size: 0.72rem; font-weight: 600;
    cursor: pointer; }
  #paneltoggle .caret { color: var(--signal); font-weight: 700; }

  footer { flex: none; padding: 7px 20px 9px; font-size: 0.64rem; color: var(--ink-3);
    line-height: 1.5; }
  footer a { color: var(--ink-2); }
  footer summary { cursor: pointer; list-style: none; display: flex; gap: 7px;
    align-items: baseline; white-space: nowrap; overflow: hidden; }
  footer summary::-webkit-details-marker { display: none; }
  footer summary .src { overflow: hidden; text-overflow: ellipsis; }
  footer summary .more { color: var(--signal); font-weight: 600; flex: none; }
  footer summary .more::after { content: " ▾"; }
  footer details[open] summary .more::after { content: " ▴"; }
  footer .notes { margin-top: 7px; max-height: 32vh; overflow-y: auto; padding-right: 10px;
    border-top: 1px solid var(--rule); padding-top: 7px; }
  footer .notes p { margin: 0 0 6px; }
  footer .notes b { color: var(--ink-2); }
  .maplibregl-popup-content { background: var(--panel-2); color: var(--ink);
    border: 1px solid var(--rule); font-size: 0.76rem; padding: 10px 12px; line-height: 1.5;
    max-width: 280px; }
  .maplibregl-popup-content b { color: var(--signal); }
  .maplibregl-popup-tip { border-top-color: var(--panel-2) !important; }
  @media (max-width: 700px) {
    .titlecard { left: 10px; top: 10px; max-width: calc(100% - 20px); }
    .panel { left: 10px; bottom: 56px; max-width: 196px; max-height: calc(100% - 78px); }
    .panel.collapsed { display: none; }
    #paneltoggle { display: inline-flex; }
  }
</style>

<div class="wrap">
  <div id="map"></div>
  <div class="titlecard">
    <h1>Every Texas police grant your car insurance paid for</h1>
    <p>All 149 awards made in 2026 by the Motor Vehicle Crime Prevention
      Authority, funded by $5 per insured vehicle per year.
      <a href="https://geopen.io/">geopen.io</a></p>
  </div>
  <button id="paneltoggle" type="button" aria-expanded="true" aria-controls="panel">
    <span class="caret">▾</span><span id="pt-label">Hide legend</span>
  </button>
  <div class="panel" id="panel">
    <div class="state" id="state"></div>
    <h2>What the grant is for</h2>
    <div id="legend"></div>
    <p class="hint" id="hint"></p>
    <div class="controls">
      <h2>Award size</h2>
      <div class="scale" id="scale"></div>
      <h2>Basemap</h2>
      <div class="bases" id="bases"></div>
    </div>
  </div>
</div>

<footer id="foot">Loading…</footer>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const E = "https://server.arcgisonline.com/ArcGIS/rest/services";
const BASES = [
  { id: "dark", label: "Dark", url: `${E}/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}`,
    ref: `${E}/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}`, opacity: 0.55, dark: true },
  { id: "light", label: "Light", url: `${E}/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}`,
    ref: `${E}/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}`, opacity: 1, dark: false },
  { id: "topo", label: "Streets", url: `${E}/World_Street_Map/MapServer/tile/{z}/{y}/{x}`,
    ref: null, opacity: 1, dark: false },
  { id: "sat", label: "Satellite", url: `${E}/World_Imagery/MapServer/tile/{z}/{y}/{x}`,
    ref: `${E}/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}`, opacity: 1, dark: true },
];
let baseKey = "dark", picked = null;

// Three buckets, loudest where the money bought surveillance. "Other" is most
// of the list and is deliberately quiet — task forces, prosecutors, analysts.
const CATS = [
  ["flock", "Names Flock outright", "#ff9f43"],
  ["camera", "Cameras or plate readers", "#48e5c2"],
  ["other", "Other vehicle-crime grant", "#5f7080"],
];
const COL = Object.fromEntries(CATS.map(([k, , c]) => [k, c]));
const money = (v) => "$" + Math.round(v).toLocaleString();
const short = (v) => v >= 1e6 ? "$" + (v / 1e6).toFixed(1) + "m"
  : v >= 1e3 ? "$" + Math.round(v / 1e3) + "k" : "$" + v;

document.getElementById("bases").innerHTML = BASES.map((b) =>
  `<button type="button" data-base="${b.id}" aria-pressed="${b.id===baseKey}">${b.label}</button>`).join("");
document.getElementById("bases").addEventListener("click", (e) => {
  const bm = BASES.find((b) => b.id === (e.target.dataset && e.target.dataset.base));
  if (bm) setBase(bm);
});

(function () {
  const btn = document.getElementById("paneltoggle");
  const panel = document.getElementById("panel");
  const label = document.getElementById("pt-label");
  btn.addEventListener("click", () => {
    const open = !panel.classList.toggle("collapsed");
    btn.setAttribute("aria-expanded", String(open));
    label.textContent = open ? "Hide legend" : "Legend";
    btn.querySelector(".caret").textContent = open ? "▾" : "▴";
  });
})();

const map = new maplibregl.Map({
  container: "map",
  style: { version: 8,
    sources: {
      base: { type: "raster", tileSize: 256, maxzoom: 19, attribution: "© Esri", tiles: [BASES[0].url] },
      ref: { type: "raster", tileSize: 256, maxzoom: 19, tiles: [BASES.find((b)=>b.ref).ref] },
    },
    layers: [{ id: "base", type: "raster", source: "base",
      paint: { "raster-opacity": BASES[0].opacity } }],
  },
  // deliberately identical to texas-alpr-cameras.html — the two maps are read
  // against each other, so they must frame the state the same way
  center: [-97.6, 31.3], zoom: 5.6, attributionControl: { compact: true },
});
map.addControl(new maplibregl.NavigationControl(), "top-right");
map.addControl(new maplibregl.ScaleControl({ unit: "imperial" }), "bottom-right");
window.__map = map;

function setBase(bm) {
  baseKey = bm.id;
  map.getSource("base").setTiles([bm.url]);
  map.setPaintProperty("base", "raster-opacity", bm.opacity);
  if (bm.ref) map.getSource("ref").setTiles([bm.ref]);
  if (map.getLayer("ref")) map.setLayoutProperty("ref", "visibility", bm.ref ? "visible" : "none");
  if (map.getLayer("g")) {
    map.setPaintProperty("g", "circle-stroke-color", bm.dark ? "#0c0e11" : "#ffffff");
  }
  document.querySelectorAll("#bases button").forEach((x) =>
    x.setAttribute("aria-pressed", String(x.dataset.base === bm.id)));
}

let FEATS = [];
const catOf = (p) => p.flock ? "flock" : p.camera ? "camera" : "other";

function applyFilter() {
  if (map.getLayer("g")) {
    map.setFilter("g", picked === null ? null
      : picked === "flock" ? ["==", ["get", "flock"], true]
      : picked === "camera" ? ["all", ["==", ["get", "camera"], true],
                                     ["!=", ["get", "flock"], true]]
      : ["==", ["get", "camera"], false]);
  }
  document.querySelectorAll(".row").forEach((r) =>
    r.classList.toggle("on", picked === r.dataset.k));
  state(); drawLegend();
}
window.pick = (k) => { picked = picked === k ? null : k; applyFilter(); };
window.clearPick = () => { picked = null; applyFilter(); };

function shown() {
  return FEATS.filter((f) => picked === null || catOf(f.properties) === picked);
}
function state() {
  const on = shown();
  const sum = on.reduce((a, f) => a + f.properties.award, 0);
  const lab = picked ? (CATS.find(([k]) => k === picked) || [, picked])[1].toLowerCase() : null;
  document.getElementById("state").innerHTML =
    `<b>${money(sum)}</b> across ${on.length} grant${on.length === 1 ? "" : "s"}` +
    `<span>${lab ? lab : "awarded for the 2026 fiscal year"}</span>`;
  document.getElementById("hint").innerHTML = picked
    ? `<button class="clear" onclick="clearPick()">show all 148</button>`
    : "Grants are placed at the centre of the city or county that received them, " +
      "and sized by award.";
}
function drawLegend() {
  const n = {}, s = {};
  for (const f of FEATS) {
    const k = catOf(f.properties);
    n[k] = (n[k] || 0) + 1; s[k] = (s[k] || 0) + f.properties.award;
  }
  document.getElementById("legend").innerHTML = CATS.map(([k, lab, col]) =>
    `<button class="row" data-k="${k}" onclick="pick(this.dataset.k)">
      <i style="background:${col}"></i><span>${lab}</span>
      <b>${n[k] || 0}</b></button>`).join("");
  document.querySelectorAll(".row").forEach((r) =>
    r.classList.toggle("on", picked === r.dataset.k));
}

/* Same touch fix as the plate-reader map: every hover handler is also
   registered on click, so a tap opens the popup on a phone. */
(function () {
  const _on = map.on.bind(map);
  map.on = function (type, layer, fn) {
    _on(type, layer, fn);
    if (type === "mousemove" && typeof layer === "string" && typeof fn === "function") {
      _on("click", layer, fn);
    }
    return map;
  };
})();

map.on("load", () => {
  fetch("/data/texas_mvcpa_grants.geojson").then((r) => r.json()).then((gj) => {
    FEATS = gj.features;
    map.addSource("g", { type: "geojson", data: gj });
    map.addLayer({ id: "g", type: "circle", source: "g",
      paint: {
        // area, not radius, tracks the award — a $2m grant should look twice
        // the weight of a $500k one, not four times.
        "circle-radius": ["interpolate", ["linear"], ["zoom"],
          5, ["interpolate", ["linear"], ["sqrt", ["get", "award"]], 84, 3, 1400, 22],
          9, ["interpolate", ["linear"], ["sqrt", ["get", "award"]], 84, 5, 1400, 40]],
        "circle-color": ["case",
          ["==", ["get", "flock"], true], COL.flock,
          ["==", ["get", "camera"], true], COL.camera,
          COL.other],
        "circle-opacity": 0.66,
        "circle-stroke-color": "#0c0e11",
        "circle-stroke-width": 0.8 } });
    map.addLayer({ id: "ref", type: "raster", source: "ref", paint: { "raster-opacity": 0.8 } });
    setBase(BASES[0]);
    drawLegend(); state();

    document.getElementById("scale").innerHTML = [50000, 400000, 1500000].map((v) => {
      const r = 3 + (Math.sqrt(v) - 84) / (1400 - 84) * 19;
      return `<div><span style="width:${(r*2).toFixed(0)}px;height:${(r*2).toFixed(0)}px"></span>${short(v)}</div>`;
    }).join("");

    const pop = new maplibregl.Popup({ closeButton: false, maxWidth: "300px" });
    map.on("mousemove", "g", (e) => {
      map.getCanvas().style.cursor = "pointer";
      const p = e.features[0].properties;
      pop.setLngLat(e.features[0].geometry.coordinates.slice()).setHTML(
        `<b>${money(p.award)}</b> — ${p.grantee}<br>` +
        `<span style="color:#9daebe">${p.program}</span><br>` +
        `<span style="color:#6b7d8d">${p.stream === "catalytic"
          ? "catalytic converter programme" : "auto theft task force"}` +
        ` · grant ${p.grant_no}</span>`
      ).addTo(map);
    });
    map.on("mouseleave", "g", () => { map.getCanvas().style.cursor = ""; pop.remove(); });
  });
});

const A = (h, t) => `<a href="${h}" target="_blank" rel="noopener">${t}</a>`;
document.getElementById("foot").innerHTML = `<details><summary>
    <span class="src">Awards from the ${A("https://www.txdmv.gov/about-us/MVCPA/grantees", "Motor Vehicle Crime Prevention Authority")},
      FY2026 · public record · ${A("https://geopen.io/", "geopen.io")}</span>
    <span class="more">Where this comes from, and what it can't tell you</span>
  </summary>
  <div class="notes">
    <p><b>Nothing here was hidden.</b> The state publishes every one of these
      awards — as a PDF, once a year, with no spreadsheet and no API. This map is
      that PDF, parsed. All 149 grants total $51,152,613, which is the figure the
      document itself prints at the bottom.</p>
    <p><b>Where the money comes from.</b> Insurers pay the authority a fee for
      every vehicle they cover. SB 224, passed unanimously in 2023, raised it
      from <b>$4 to $5 per insured vehicle per year</b> — and reserved that extra
      dollar, in the statute, "to be used only for coordinated regulatory and law
      enforcement activities intended to detect and prevent catalytic converter
      theft."</p>
    <p><b>The law never mentions cameras.</b> Not once. Searched end to end, the
      enrolled bill contains no "camera", no "licence plate reader", no
      "surveillance", no "technology". It says "catalytic converter" 62 times.
      The legislature restricted what the money was <i>for</i>; it said nothing
      about what to buy, and agencies bought cameras.</p>
    <p><b>Which is where the cameras are.</b> Grants numbered with a trailing C
      are the catalytic converter programme — 117 awards worth $21.1m, against
      $30.0m for the older auto theft task forces. <b>38 of the 39 grants that
      name a camera sit in the converter programme</b>, as do 15 of the 16 that
      name Flock.</p>
    <p><b>The camera count is a floor.</b> 39 grants name cameras, licence plate
      readers or ALPR in the programme title, and 16 name Flock outright. That is
      what the <i>title</i> says — a grant called "Auto Theft Task Force" may buy
      cameras too and would not be counted here. Read 39 as the minimum, never
      the total. In August 2026 the governor ordered state agencies to stop
      funding Flock cameras, and Dallas said it would switch off 321 of its 684.</p>
    <p><b>One fiscal year only.</b> This is FY2026. The Texas Tribune, which
      reported the fee-to-camera link in August 2026, counted at least $30m and
      3,200 cameras across several years.</p>
    <p><b>Points are placed, not located.</b> Each grant sits at the centre of
      the city or county that received it, because the state publishes a
      grantee, not an address. 148 of 149 resolved; the University of St. Thomas
      is a private university rather than a place, so it is not shown.</p>
  </div></details>`;
</script>
