<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DFW land cover, 2001 to now</title>
<meta name="description" content="Land cover and satellite imagery for Dallas–Fort Worth by year. USGS NLCD 2001–2021 and Esri Wayback imagery 2014–2026, read live from the source.">
<link rel="canonical" href="https://geopen.io/maps/dfw-land-cover.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="geopen.io">
<meta property="og:title" content="DFW land cover, 2001 to now">
<meta property="og:description" content="Classified land cover and satellite imagery for Dallas–Fort Worth, by year.">
<meta property="og:url" content="https://geopen.io/maps/dfw-land-cover.html">
<meta property="og:image" content="https://geopen.io/maps/dfw-land-cover-card.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://geopen.io/maps/dfw-land-cover-card.png">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root {
    --ground: #101310; --panel: #191d18; --panel-2: #232821;
    --rule: rgba(225,235,215,0.15);
    --ink: #edf2e9; --ink-2: #a6b39c; --ink-3: #75826c;
    --signal: #7fc45f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ground); color: var(--ink);
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  .wrap { flex: 1; min-height: 0; position: relative; }
  #map { position: absolute; inset: 0; }

  .titlecard { position: absolute; left: 16px; top: 16px; z-index: 6; max-width: 300px;
    background: var(--panel); border: 1px solid var(--rule); border-radius: 3px;
    padding: 11px 14px 12px; }
  .titlecard h1 { margin: 0; font-size: 0.98rem; font-weight: 700; line-height: 1.25;
    letter-spacing: -0.01em; }
  .titlecard p { margin: 5px 0 0; font-size: 0.71rem; color: var(--ink-3); line-height: 1.5; }
  .titlecard a { color: var(--ink-2); text-decoration: none; }
  .titlecard a:hover { color: var(--signal); }

  /* The year strip is the interface, so it gets the width. */
  .yearbar { position: absolute; left: 16px; right: 16px; bottom: 16px; z-index: 6;
    background: var(--panel); border: 1px solid var(--rule); border-radius: 3px;
    padding: 10px 14px 12px; }
  .yearhead { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .yearnum { font-size: 2.1rem; font-weight: 800; line-height: 1; letter-spacing: -0.03em;
    color: var(--signal); font-variant-numeric: tabular-nums; min-width: 3.6ch; }
  .modes { display: flex; gap: 4px; margin-left: auto; }
  .modes button, .bases button { background: var(--panel-2); border: 1px solid var(--rule);
    color: var(--ink-2); font: inherit; font-size: 0.68rem; padding: 4px 11px;
    border-radius: 3px; cursor: pointer; }
  .modes button[aria-pressed="true"] { background: var(--signal); border-color: var(--signal);
    color: #12210c; font-weight: 700; }
  .years { display: flex; gap: 3px; margin-top: 10px; flex-wrap: wrap; }
  .years button { flex: 1 1 auto; min-width: 46px; background: var(--panel-2);
    border: 1px solid var(--rule); color: var(--ink-2); font: inherit; font-size: 0.68rem;
    padding: 5px 2px; border-radius: 3px; cursor: pointer; font-variant-numeric: tabular-nums; }
  .years button:hover { color: var(--ink); border-color: var(--signal); }
  .years button[aria-pressed="true"] { background: var(--signal); border-color: var(--signal);
    color: #12210c; font-weight: 700; }
  .meta { font-size: 0.68rem; color: var(--ink-3); line-height: 1.45; }
  .meta b { color: var(--ink-2); }

  .legend { position: absolute; right: 16px; top: 16px; z-index: 6; background: var(--panel);
    border: 1px solid var(--rule); border-radius: 3px; padding: 9px 11px 10px;
    max-height: calc(100% - 190px); overflow-y: auto; scrollbar-width: thin; }
  .legend h2 { margin: 0 0 6px; font-size: 0.56rem; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--ink-3); font-weight: 600; }
  .lg { display: flex; align-items: center; gap: 7px; font-size: 0.66rem;
    color: var(--ink-2); padding: 1.5px 0; }
  .lg i { width: 12px; height: 12px; border-radius: 2px; flex: none;
    border: 1px solid rgba(0,0,0,0.3); }

  footer { flex: none; padding: 7px 20px 9px; font-size: 0.64rem; color: var(--ink-3);
    line-height: 1.5; }
  footer a { color: var(--ink-2); }
  @media (max-width: 820px) {
    .titlecard { left: 10px; top: 10px; max-width: calc(100% - 20px); }
    .legend { display: none; }
    .yearbar { left: 10px; right: 10px; bottom: 10px; padding: 8px 10px 10px; }
    .yearnum { font-size: 1.6rem; }
  }
</style>

<div class="wrap">
  <div id="map"></div>
  <div class="titlecard">
    <h1>DFW land cover, 2001 to now</h1>
    <p>Classified land cover and satellite imagery by year, read live from USGS
      and Esri. <a href="https://geopen.io/">geopen.io</a></p>
  </div>
  <div class="legend" id="legend"></div>
  <div class="yearbar">
    <div class="yearhead">
      <div class="yearnum" id="yearnum">2021</div>
      <div class="meta" id="meta"></div>
      <div class="modes" id="modes">
        <button type="button" data-mode="nlcd" aria-pressed="true">Land cover</button>
        <button type="button" data-mode="sat" aria-pressed="false">Satellite</button>
      </div>
    </div>
    <div class="years" id="years"></div>
  </div>
</div>
<footer id="foot"></footer>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
// USGS classified land cover, one raster per survey year. Not annual: the survey
// runs on a two-to-three year cadence and 2021 is the newest published.
const NLCD_YEARS = ["2001","2004","2006","2008","2011","2013","2016","2019","2021"];
const nlcdUrl = (y) =>
  "https://www.mrlc.gov/geoserver/mrlc_display/wms?service=WMS&version=1.1.1" +
  `&request=GetMap&layers=NLCD_${y}_Land_Cover_L48&styles=&bbox={bbox-epsg-3857}` +
  "&width=256&height=256&srs=EPSG:3857&format=image/png&transparent=true";

// Esri Wayback keeps every published version of its imagery basemap; each id is
// one release. These are the earliest release in each year.
const SAT_YEARS = [
  ["2014","10"], ["2015","20222"], ["2016","3515"], ["2017","577"], ["2018","13161"],
  ["2019","6036"], ["2020","23001"], ["2021","1049"], ["2022","42663"],
  ["2023","11475"], ["2024","41468"], ["2025","36557"], ["2026","22252"],
];
const satUrl = (id) =>
  "https://wayback.maptiles.arcgis.com/arcgis/rest/services/World_Imagery/WMTS/1.0.0" +
  `/default028mm/MapServer/tile/${id}/{z}/{y}/{x}`;

// the NLCD palette, which is the survey's own and should not be restyled
const LEGEND = [
  ["#ab0000","Developed, high intensity"],
  ["#d60000","Developed, medium intensity"],
  ["#ff6b6b","Developed, low intensity"],
  ["#ffc4c4","Developed, open space"],
  ["#ab6c28","Cultivated crops"],
  ["#dbd83d","Pasture / hay"],
  ["#e8d174","Grassland"],
  ["#ccb879","Shrub / scrub"],
  ["#68ab5f","Deciduous forest"],
  ["#1c5f2c","Evergreen forest"],
  ["#b5c58f","Mixed forest"],
  ["#466b9f","Open water"],
  ["#b8d9eb","Woody wetlands"],
  ["#7ec5d0","Herbaceous wetlands"],
];
let mode = "nlcd", year = "2021";

const map = new maplibregl.Map({
  container: "map",
  style: { version: 8,
    glyphs: "https://protomaps.github.io/basemaps-assets/fonts/{fontstack}/{range}.pbf",
    sources: {
      base: { type: "raster", tileSize: 256, maxzoom: 19, attribution: "© Esri",
        tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}"] },
      cover: { type: "raster", tileSize: 256, tiles: [nlcdUrl("2021")] },
      ref: { type: "raster", tileSize: 256, maxzoom: 19,
        tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}"] },
    },
    layers: [
      { id: "base", type: "raster", source: "base", paint: { "raster-opacity": 0.5 } },
      { id: "cover", type: "raster", source: "cover", paint: { "raster-opacity": 1 } },
      { id: "ref", type: "raster", source: "ref", paint: { "raster-opacity": 0.85 } },
    ],
  },
  center: [-97.0, 32.85], zoom: 8.9, attributionControl: { compact: true },
});
map.addControl(new maplibregl.NavigationControl(), "top-right");
map.addControl(new maplibregl.ScaleControl({ unit: "imperial" }), "bottom-right");
window.__map = map;

function years() { return mode === "nlcd" ? NLCD_YEARS : SAT_YEARS.map(([y]) => y); }
function tilesFor(y) {
  if (mode === "nlcd") return nlcdUrl(y);
  const hit = SAT_YEARS.find(([yy]) => yy === y);
  return satUrl(hit ? hit[1] : SAT_YEARS[SAT_YEARS.length - 1][1]);
}
function paint() {
  document.getElementById("yearnum").textContent = year;
  document.getElementById("meta").innerHTML = mode === "nlcd"
    ? `<b>USGS National Land Cover Database</b> · 30 m per pixel<br>` +
      `published for survey years only, not annually`
    : `<b>Esri Wayback imagery</b> · earliest release of ${year}<br>` +
      `true colour, resolution varies by area and date`;
  document.getElementById("years").innerHTML = years().map((y) =>
    `<button type="button" data-y="${y}" aria-pressed="${y===year}">${y}</button>`).join("");
  document.querySelectorAll("#modes button").forEach((b) =>
    b.setAttribute("aria-pressed", String(b.dataset.mode === mode)));
  // the classified raster needs the dark ground under it; imagery does not.
  // guarded because paint() runs once before the style has finished loading
  if (map.isStyleLoaded() && map.getLayer("base")) {
    map.setPaintProperty("base", "raster-opacity", mode === "nlcd" ? 0.5 : 0);
  }
  document.getElementById("legend").style.display = mode === "nlcd" ? "" : "none";
}
function show(y) {
  year = y;
  if (map.getSource("cover")) map.getSource("cover").setTiles([tilesFor(y)]);
  paint();
}
document.getElementById("years").addEventListener("click", (e) => {
  const y = e.target.dataset && e.target.dataset.y;
  if (y) show(y);
});
document.getElementById("modes").addEventListener("click", (e) => {
  const m = e.target.dataset && e.target.dataset.mode;
  if (!m || m === mode) return;
  mode = m;
  // keep the nearest year that exists in the new mode rather than snapping to an end
  const ys = years();
  year = ys.includes(year) ? year
    : ys.reduce((a, b) => Math.abs(+b - +year) < Math.abs(+a - +year) ? b : a, ys[0]);
  show(year);
});

document.getElementById("legend").innerHTML = "<h2>Land cover class</h2>" +
  LEGEND.map(([c, l]) => `<div class="lg"><i style="background:${c}"></i>${l}</div>`).join("");
paint();
map.on("load", paint);

document.getElementById("foot").innerHTML =
  `Land cover from the <a href="https://www.mrlc.gov/" target="_blank" rel="noopener">USGS National Land Cover Database</a>, ` +
  `served by the Multi-Resolution Land Characteristics Consortium · imagery from ` +
  `<a href="https://livingatlas.arcgis.com/wayback/" target="_blank" rel="noopener">Esri Wayback</a>. ` +
  `Both are read live, so nothing here is stored or pre-rendered. ` +
  `<b>NLCD is a model, not a photograph</b> — every 30-metre pixel is assigned one of sixteen classes, ` +
  `so a street with trees becomes whichever the classifier judged dominant. ` +
  `It is published for survey years only, which is why the years are unevenly spaced and stop at 2021. ` +
  `Imagery years are the earliest release Esri published in each year and can carry photography flown months earlier.`;
</script>
