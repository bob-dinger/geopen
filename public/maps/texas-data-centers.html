<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Every data center filed in Texas — 671 filings, 70 million square feet</title>
<meta name="description" content="671 data center filings from the Texas licensing record, at their street addresses. 279 new buildings, 70.7 million square feet — and two thirds of it filed since the start of 2025.">
<link rel="canonical" href="https://geopen.io/maps/texas-data-centers.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="geopen.io">
<meta property="og:title" content="Every data center filed in Texas, and who is building it">
<meta property="og:description" content="$12.1B of new data center construction on the Texas record. Two-thirds of it was filed in the last two years.">
<meta property="og:url" content="https://geopen.io/maps/texas-data-centers.html">
<meta property="og:image" content="https://geopen.io/maps/texas-data-centers-card.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  /* Server-room palette: near-black with a cold cyan signal. Points are the
     only saturated thing on the page. */
  :root {
    --ground: #0b0f12; --panel: #141a1f; --panel-2: #1c242b;
    --rule: rgba(200,230,240,0.14);
    --ink: #e8f1f5; --ink-2: #9fb2bd; --ink-3: #6d818d;
    --signal: #35e0d4; --warm: #ffb648;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ground); color: var(--ink);
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  /* The title floats over the map rather than banding across the top, so the
     map is the page and the framing sits on it. Same card language as the
     control panel below it. */
  .titlecard { position: absolute; left: 16px; top: 16px; z-index: 6; max-width: 340px;
    background: var(--panel); border: 1px solid var(--rule); border-radius: 3px;
    padding: 11px 14px 12px; }
  .titlecard h1 { margin: 0; font-size: 0.98rem; font-weight: 700;
    letter-spacing: -0.01em; line-height: 1.25; text-wrap: balance; }
  .titlecard .sub { margin: 5px 0 0; font-size: 0.71rem; color: var(--ink-3);
    line-height: 1.5; }
  .home { color: var(--ink-2); text-decoration: none; white-space: nowrap; }
  .home:hover { color: var(--signal); }

  /* The year filter lives in the panel now, sized to it. The distribution is
     still legible at this width and each bar is still a click target. */
  .bar { flex: 1; min-width: 0; display: flex; flex-direction: column;
    justify-content: flex-end; align-items: center; height: 100%; cursor: pointer;
    background: none; border: 0; padding: 0; font: inherit; }
  .bar i { display: block; width: 100%; background: #2b6b74; border-radius: 2px 2px 0 0;
    transition: opacity 0.12s; min-height: 1px; }
  .bar.hot i { background: var(--signal); }
  .bar:hover i { opacity: 0.72; }
  .bar.off i { opacity: 0.2; }
  .bar span { font-size: 0.5rem; color: var(--ink-3); margin-top: 2px;
    font-variant-numeric: tabular-nums; }
  .bar.on span { color: var(--ink); font-weight: 700; }
  .clear { background: none; border: 1px solid var(--rule); color: var(--signal);
    border-radius: 3px; font: inherit; font-size: 0.63rem; padding: 3px 8px;
    cursor: pointer; }
  .clear:hover { border-color: var(--signal); }

  .wrap { flex: 1; min-height: 0; position: relative; }
  #map { position: absolute; inset: 0; }
  .panel { position: absolute; left: 16px; bottom: 16px; z-index: 5; background: var(--panel);
    border: 1px solid var(--rule); border-radius: 3px; padding: 9px 12px 10px;
    max-width: 214px; max-height: calc(100% - 32px); overflow-y: auto; scrollbar-width: thin; }
  .panel h2 { margin: 0 0 5px; font-size: 0.58rem; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--ink-3); font-weight: 600; }
  .panel h2:not(:first-child) { margin-top: 9px; }
  .lyr { display: flex; align-items: center; gap: 7px; padding: 1px 0; font-size: 0.74rem;
    color: var(--ink-2); cursor: pointer; }
  .lyr input { accent-color: var(--signal); }
  /* four options no longer fit on one row at panel width, so they wrap into
     two rather than squeezing the labels to unreadable */
  .bases { display: flex; gap: 4px; flex-wrap: wrap; }
  .bases button { flex: 1 1 44%; background: var(--panel-2); border: 1px solid var(--rule);
    color: var(--ink-2); font: inherit; font-size: 0.66rem; padding: 4px 2px;
    border-radius: 3px; cursor: pointer; }
  .bases button[aria-pressed="true"] { background: var(--signal); border-color: var(--signal);
    color: #04201e; font-weight: 700; }
  .swatch { display: flex; align-items: center; gap: 6px; padding: 3px 5px; width: 100%;
    border-radius: 3px;
    background: none; border: 0; font: inherit; font-size: 0.68rem; color: var(--ink-2);
    cursor: pointer; text-align: left; }
  .swatch i { width: 11px; height: 11px; border-radius: 50%; flex: none;
    border: 1px solid rgba(255,255,255,0.35); }
  .swatch b { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 600; }
  .swatch:hover { color: var(--ink); background: var(--panel-2); }
  .swatch.on { color: var(--signal); font-weight: 700; background: var(--panel-2);
    box-shadow: inset 0 0 0 1px var(--signal); }
  /* The panel reads as a caption first: a headline saying what is on screen,
     then the key. The controls sit under a rule at the bottom, quieter, because
     in a screenshot they are furniture — most people will only ever see the
     picture. */
  .state { font-size: 0.82rem; font-weight: 700; line-height: 1.3; letter-spacing: -0.01em;
    margin-bottom: 7px; }
  .state b { color: var(--signal); font-variant-numeric: tabular-nums; }
  .state span { display: block; font-size: 0.66rem; font-weight: 400; color: var(--ink-3);
    margin-top: 2px; letter-spacing: 0; }
  .controls { margin-top: 12px; padding-top: 9px; border-top: 1px solid var(--rule);
    opacity: 0.72; }
  .controls:hover { opacity: 1; }
  .controls h2 { margin-top: 0; }
  .controls h2:not(:first-child) { margin-top: 8px; }
  .qual { text-transform: none; letter-spacing: 0; font-weight: 400;
    color: var(--ink-3); opacity: 0.8; }
  .hint { margin: 3px 0 0; font-size: 0.58rem; color: var(--ink-3); line-height: 1.45; }
  .owners { font-size: 0.68rem; }
  .own { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0;
    color: var(--ink-2); cursor: pointer; border: 0; background: none; font: inherit;
    width: 100%; text-align: left; }
  .own:hover { color: var(--signal); }
  .own.on { color: var(--signal); font-weight: 700; }
  .own b { font-variant-numeric: tabular-nums; font-weight: 600; }

  footer { flex: none; padding: 7px 22px 10px; font-size: 0.65rem; color: var(--ink-3);
    line-height: 1.55; }
  footer a { color: var(--ink-2); }
  footer summary { cursor: pointer; list-style: none; display: flex; gap: 7px;
    align-items: baseline; white-space: nowrap; overflow: hidden; }
  footer summary::-webkit-details-marker { display: none; }
  footer summary .src { overflow: hidden; text-overflow: ellipsis; }
  footer summary .more { color: var(--signal); font-weight: 600; flex: none; }
  footer summary .more::after { content: " ▾"; }
  footer details[open] summary .more::after { content: " ▴"; }
  footer .notes { margin-top: 7px; max-height: 30vh; overflow-y: auto; padding-right: 10px;
    border-top: 1px solid var(--rule); padding-top: 7px; }
  footer .notes p { margin: 0 0 6px; }
  footer .notes b { color: var(--ink-2); }
  .maplibregl-popup-content { background: var(--panel-2); color: var(--ink);
    border: 1px solid var(--rule); font-size: 0.76rem; padding: 10px 12px; line-height: 1.5; }
  .maplibregl-popup-content b { color: var(--signal); }
  .maplibregl-popup-content a { color: var(--signal); }
  .maplibregl-popup-close-button { color: var(--ink-2); font-size: 16px; padding: 0 5px; }
  .maplibregl-popup-close-button:hover { background: none; color: var(--signal); }
  .maplibregl-popup-tip { border-top-color: var(--panel-2) !important; }
  @media (max-width: 700px) {
    .panel { max-width: 170px; left: 10px; bottom: 10px; }
    footer { padding-left: 12px; padding-right: 12px; }
    .titlecard { left: 10px; top: 10px; max-width: calc(100% - 20px); padding: 9px 11px 10px; }
    .titlecard h1 { font-size: 0.88rem; }
  }
</style>

<div class="wrap">
  <div id="map"></div>
  <div class="titlecard">
    <h1>Every data center filed in Texas</h1>
    <p class="sub">Every filing in the state licensing record, at its street address —
      including the ones whose paperwork never says "data center".
      <a class="home" href="https://geopen.io/">geopen.io</a></p>
  </div>
  <div class="panel">
    <div class="state" id="state"></div>
    <div id="legend"></div>
    <p class="hint" id="leghint"></p>
    <div class="controls">
      <h2>Colour by</h2>
      <label class="lyr"><input type="radio" name="cb" id="cb-work" checked> What the filing is</label>
      <label class="lyr"><input type="radio" name="cb" id="cb-status"> How far along it is</label>
      <h2>Basemap</h2>
      <div class="bases" id="bases"></div>
    </div>
  </div>
</div>

<footer id="foot">Loading…</footer>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const E = "https://server.arcgisonline.com/ArcGIS/rest/services";
// Streets leads: these are addresses, and a reader arriving from the article
// wants to know which town a dot is in before anything else.
const BASES = [
  { id: "topo", label: "Streets", url: `${E}/World_Street_Map/MapServer/tile/{z}/{y}/{x}`,
    ref: null, opacity: 1, dark: false },
  { id: "light", label: "Light", url: `${E}/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}`,
    ref: `${E}/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}`,
    opacity: 1, dark: false },
  { id: "sat", label: "Satellite", url: `${E}/World_Imagery/MapServer/tile/{z}/{y}/{x}`,
    ref: `${E}/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}`,
    opacity: 1, dark: true },
  { id: "dark", label: "Dark", url: `${E}/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}`,
    ref: `${E}/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}`,
    opacity: 0.55, dark: true },
];
let baseKey = "topo";
// one categorical filter shared by whichever legend is showing
let pickedCat = null;   // {field, value}
let colourBy = "work";

// Three encodings. Year is sequential — a teal ramp running to a warm end so the
// newest filings read as the news they are. The other two are categorical and
// were checked for colourblind separation rather than picked by eye: worst
// adjacent pair 13.2 (filing type) and 14.9 (stage) in OKLab against a floor of 8.
const COLOUR = {
  work: { legend: "cats", field: "work",
    cats: [["New Construction", "New building", "#35e0d4"],
           ["Renovation/Alteration", "Renovation", "#c77dff"],
           ["Additions to Existing Building", "Addition", "#ffb648"]],
    hint: "Renovations and additions are work on halls that already exist. Click one to show only those." },
  status: { legend: "cats", field: "status",
    cats: [["Project Registered", "Registered", "#ffb648"],
           ["Review Complete", "Review complete", "#35e0d4"],
           ["Inspection Complete", "Inspection complete", "#2b8f95"],
           ["Project Closed", "Closed", "#1d5e66"]],
    hint: "TDLR's own accessibility review, not the building — closed means that review finished, not that anything opened. Click one to show only those." },
};

function colourExpr(mode) {
  const C = COLOUR[mode];
  return ["match", ["get", C.field],
    ...C.cats.flatMap(([v, , c]) => [v, c]), "#8a97a0"];
}
const usd = (v) => v >= 1e9 ? `$${(v / 1e9).toFixed(2)}B`
  : v >= 1e6 ? `$${Math.round(v / 1e6)}M` : `$${Math.round(v).toLocaleString()}`;
const num = (v) => (v == null ? "—" : Math.round(v).toLocaleString());

document.getElementById("bases").innerHTML = BASES.map((b) =>
  `<button type="button" data-base="${b.id}" aria-pressed="${b.id === baseKey}">${b.label}</button>`).join("");
document.getElementById("bases").addEventListener("click", (e) => {
  const bm = BASES.find((b) => b.id === (e.target.dataset && e.target.dataset.base));
  if (bm) setBase(bm);
});

const map = new maplibregl.Map({
  container: "map",
  style: { version: 8,
    glyphs: "https://protomaps.github.io/basemaps-assets/fonts/{fontstack}/{range}.pbf",
    sources: {
      base: { type: "raster", tileSize: 256, maxzoom: 19, attribution: "© Esri", tiles: [BASES[0].url] },
      // seeded from the first basemap that HAS a reference layer, not from
      // BASES[0] — the default is Streets, whose ref is null, and a null in
      // tiles[] is a style validation error that takes every layer down with it
      ref: { type: "raster", tileSize: 256, maxzoom: 19,
        tiles: [BASES.find((b) => b.ref).ref] },
    },
    layers: [{ id: "base", type: "raster", source: "base", paint: { "raster-opacity": BASES[0].opacity } }],
  },
  center: [-98.6, 31.3], zoom: 5.3, attributionControl: { compact: true },
});
map.addControl(new maplibregl.NavigationControl(), "top-right");
window.__map = map;

function setBase(bm) {
  baseKey = bm.id;
  map.getSource("base").setTiles([bm.url]);
  map.setPaintProperty("base", "raster-opacity", bm.opacity);
  if (bm.ref) map.getSource("ref").setTiles([bm.ref]);
  if (map.getLayer("ref")) map.setLayoutProperty("ref", "visibility", bm.ref ? "visible" : "none");
  // the point outline has to flip with the ground or the dots lose their edge
  if (map.getLayer("dc")) {
    map.setPaintProperty("dc", "circle-stroke-color", bm.dark ? "#0b0f12" : "#ffffff");
    map.setPaintProperty("dc", "circle-opacity", bm.dark ? 0.72 : 0.86);
  }
  document.querySelectorAll("#bases button").forEach((x) =>
    x.setAttribute("aria-pressed", String(x.dataset.base === bm.id)));
}

function applyFilter() {
  const f = ["all"];
  if (pickedCat) f.push(["==", ["get", pickedCat.field], pickedCat.value]);
  for (const id of ["dc", "dc-halo"]) {
    if (map.getLayer(id)) map.setFilter(id, f.length > 1 ? f : null);
  }
  document.querySelectorAll(".swatch").forEach((b) =>
    b.classList.toggle("on", !!pickedCat && pickedCat.value === b.dataset.v));

  note();
}
/** The hint line under the legend doubles as the state readout: what the hint
 *  says when nothing is filtered, what is filtered when something is. */
/** The headline above the key: what is on screen, in plain words and a number.
 *  This is the line a reader of a screenshot uses to know what they are seeing,
 *  so it has to be true of the current filter, not of the whole file. */
function stateLine() {
  const C = COLOUR[colourBy];
  const feats = window.__feats || [];
  const match = (f) => {
    const p = f.properties;
    if (pickedCat && p[pickedCat.field] !== pickedCat.value) return false;
    return true;
  };
  const on = feats.filter(match);
  // Floor area counts NEW CONSTRUCTION only. A renovation filing restates the
  // area of the hall it sits inside, so adding it to the new-build total counts
  // the same building twice — that is how this line first read 87.6M sq ft when
  // the real figure is 70.7M.
  const area = on.reduce((a, f) => {
    const p = f.properties;
    // `primary` is false on the second filing of a building that was filed
    // twice — a core-and-shell and a fit-out, each carrying the full area.
    // Without this the total reads 73.9M against a true 70.7M.
    if (!p.primary || p.work !== "New Construction" || p.area_is_campus) return a;
    return a + (p.sqft || 0);
  }, 0);
  const newN = on.filter((f) => f.properties.primary
    && f.properties.work === "New Construction").length;
  let what = "data center filings";
  if (pickedCat) {
    const hit = C.cats.find(([v]) => v === pickedCat.value);
    const lab = hit ? hit[1].toLowerCase() : pickedCat.value;
    what = colourBy === "work" ? `${lab}${lab.endsWith("g") ? "s" : "s"}`
      : `filings at "${lab}"`;
  }
  // The count is what is drawn, not what is in the file: six of the 671 have an
  // address Azure could not place inside Texas and are not on the map.
  const sub = area > 0
    ? `${(area / 1e6).toFixed(1)} million sq ft of new building` +
      (newN !== on.length ? ` across ${newN.toLocaleString()} of them` : "")
    : "no new construction in this selection";
  document.getElementById("state").innerHTML =
    `<b>${on.length.toLocaleString()}</b> ${what}` +
    `<span>${sub} · Texas</span>`;
}

function note() {
  const C = COLOUR[colourBy];
  const bits = [];
  if (pickedCat) {
    const hit = C.cats.find(([v]) => v === pickedCat.value);
    bits.push(`<b>${hit ? hit[1] : pickedCat.value}</b>`);
  }
  document.getElementById("leghint").innerHTML = bits.length
    ? `<button class="clear" onclick="clearAll()">show all 671 again</button>`
    : `<b>Click a colour</b> to show only those. ${C.hint}`;
  stateLine();
}
window.pickCat = (v) => {
  const field = COLOUR[colourBy].field;
  pickedCat = (pickedCat && pickedCat.value === v) ? null : { field, value: v };
  applyFilter();
};
window.clearAll = () => {
  pickedCat = null; applyFilter();
};

Promise.all([
  fetch("/data/data_centers.geojson").then((r) => r.json()),
  fetch("/data/data_centers_stats.json").then((r) => r.json()),
]).then(([gj, s]) => {
  map.on("load", () => {
    map.addSource("dc", { type: "geojson", data: gj });
    // area tracks cost, so a $765M hall reads as what it is next to a $2M fit-out
    // Sized by floor area, not cost. Cost at filing turned out to be the
    // campus figure on some of the largest projects — $8,532/sq ft where the
    // median build is $683 — so it cannot drive the geometry.
    const r = ["interpolate", ["linear"], ["zoom"],
      5, ["interpolate", ["linear"], ["sqrt", ["coalesce", ["get", "sqft"], 0]], 0, 3, 500, 7, 1400, 17],
      11, ["interpolate", ["linear"], ["sqrt", ["coalesce", ["get", "sqft"], 0]], 0, 5, 500, 16, 1400, 42]];
    map.addLayer({ id: "dc-halo", type: "circle", source: "dc",
      paint: { "circle-radius": r, "circle-color": "rgba(0,0,0,0)",
        "circle-stroke-color": "#35e0d4", "circle-stroke-width": 0.9, "circle-stroke-opacity": 0.5 } });
    map.addLayer({ id: "dc", type: "circle", source: "dc",
      paint: { "circle-radius": r,
        "circle-color": colourExpr("work"),
        "circle-opacity": 0.72, "circle-stroke-color": "#0b0f12", "circle-stroke-width": 0.6 } });
    map.addLayer({ id: "ref", type: "raster", source: "ref", paint: { "raster-opacity": 0.75 } });
    setBase(BASES[0]);

    // Two popups, because a hover popup cannot hold a link — moving the cursor
    // toward it dismisses it. Hover scans; click pins one you can read and
    // follow through to the filing itself.
    const foundBy = (v) => {
      if (Array.isArray(v)) return v.join(", ");
      if (typeof v === "string") {
        try { const a = JSON.parse(v); return Array.isArray(a) ? a.join(", ") : v; }
        catch (e) { return v; }
      }
      return "?";
    };
    const card = (p, withLink) =>
      `<b>${p.name || "Unnamed"}</b><br>` +
      `${p.owner ? `Filed by ${p.owner}` : "owner not stated"}<br>` +
      `${p.address ? p.address + "<br>" : ""}${p.city}, ${p.county} County<br>` +
      `${p.sqft ? `<b>${num(p.sqft)} sq ft</b>` : "floor area not stated"}` +
      `${p.cost ? ` · ${usd(p.cost)}${p.cost_suspect ? " (campus figure)" : ""}` : ""}<br>` +
      `${p.work} · filed ${p.registered || "?"}<br>` +
      (p.geo_precision === "county"
        ? `<span style="color:#ffb648">Address could not be placed — shown at the ` +
          `centre of ${p.county} County</span><br>` : "") +
      `<span style="color:#6d818d">${(p.scope || "").slice(0, 150)}</span>` +
      // MapLibre hands array properties back as JSON strings, not arrays, so
      // this has to parse before it can join — calling .join() on the string
      // threw on every hover and every click, and killed both popups outright
      `<br><span style="color:#6d818d">found via ${foundBy(p.found_by)}</span>` +
      (withLink
        ? `<br><a href="${p.url}" target="_blank" rel="noopener"
             style="color:#35e0d4;font-weight:600">Filing ${p.project} at TDLR →</a>`
        : `<br><span style="color:#6d818d">click to open the filing</span>`);

    const hover = new maplibregl.Popup({ closeButton: false, maxWidth: "310px",
      closeOnClick: false });
    const pinned = new maplibregl.Popup({ closeButton: true, maxWidth: "310px" });
    map.on("mousemove", "dc", (e) => {
      map.getCanvas().style.cursor = "pointer";
      if (pinned.isOpen()) return;
      hover.setLngLat(e.lngLat).setHTML(card(e.features[0].properties, false)).addTo(map);
    });
    map.on("mouseleave", "dc", () => { map.getCanvas().style.cursor = ""; hover.remove(); });
    map.on("click", "dc", (e) => {
      hover.remove();
      const p = e.features[0].properties;
      pinned.setLngLat(e.features[0].geometry.coordinates.slice())
        .setHTML(card(p, true)).addTo(map);
    });

    applyFilter();
  });

  // Counts come off the loaded features rather than the stats file, so the
  // legend can never advertise a category the map is not drawing.
  window.__feats = gj.features;
  window.drawLegend = () => {
    const C = COLOUR[colourBy];
    const n = {};
    for (const f of window.__feats) {
      const k = f.properties[C.field];
      n[k] = (n[k] || 0) + 1;
    }
    document.getElementById("legend").innerHTML =
      C.cats.filter(([v]) => n[v]).map(([v, lab, col]) =>
        `<button class="swatch" data-v="${v}" onclick="pickCat(this.dataset.v)">
          <i style="background:${col}"></i><span>${lab}</span><b>${n[v]}</b></button>`).join("");
    note();
  };

  for (const [id, mode] of [["cb-work", "work"], ["cb-status", "status"]]) {
    document.getElementById(id).addEventListener("change", () => {
      colourBy = mode;
      // a filter set from the previous legend would silently survive the switch
      pickedCat = null;
      map.setPaintProperty("dc", "circle-color", colourExpr(mode));
      drawLegend();
      applyFilter();
    });
  }

  drawLegend();
  note();
});

const A = (h, t) => `<a href="${h}" target="_blank" rel="noopener">${t}</a>`;
document.getElementById("foot").innerHTML = `<details><summary>
    <span class="src">Filings from the ${A("https://www.tdlr.texas.gov/tabs/search",
