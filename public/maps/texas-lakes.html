<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>When every lake in Texas was built</title>
<meta name="description" content="Completion years for 7,421 Texas dams — every reservoir in the state, when its dam was finished, how big it is and what it was for. Texas built half its lakes in a thirty-year window and has barely built one since.">
<link rel="canonical" href="https://geopen.io/maps/texas-lakes.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="geopen.io">
<meta property="og:title" content="When every lake in Texas was built">
<meta property="og:description" content="Texas has one natural lake. The other 7,000 have a completion date — and almost all of them share the same thirty years.">
<meta property="og:url" content="https://geopen.io/maps/texas-lakes.html">
<meta property="og:image" content="https://geopen.io/maps/texas-lakes-card.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://geopen.io/maps/texas-lakes-card.png">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  /* One hue, light to dark, because the variable is a year and a year is
     sequential — no rainbow. The ground is a blue-biased dark rather than a
     neutral grey so impounded water reads as the subject. The single warm
     accent is spent on the 1960s bar and nowhere else. */
  :root {
    --ground: #0a1017; --panel: #121c25; --panel-2: #1a2833;
    --rule: rgba(190,225,245,0.14);
    --ink: #e9f1f6; --ink-2: #9db3c2; --ink-3: #6b8496;
    --accent: #f0b429;
    --c1: #163a55; --c2: #1f5c85; --c3: #2b83b3; --c4: #4aabd6; --c5: #86cfe8;
    --c6: #c2e9f4; --c0: #4a5a66;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ground); color: var(--ink);
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
  body { display: flex; flex-direction: column; overflow: hidden; }

  header { padding: 11px 22px 0; flex: none; }
  .title { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 1.02rem; font-weight: 700; letter-spacing: -0.01em; }
  .home { font-size: 0.72rem; color: var(--ink-3); text-decoration: none; }
  .home:hover { color: var(--c5); }
  .sub { margin: 3px 0 0; font-size: 0.74rem; color: var(--ink-3); }

  .stats { display: flex; gap: 10px; padding: 10px 22px 3px; flex: none;
    overflow-x: auto; scrollbar-width: none; }
  .stats::-webkit-scrollbar { display: none; }
  .stat { background: var(--panel); border: 1px solid var(--rule); border-radius: 3px;
    padding: 8px 14px 9px; min-width: 138px; flex: none; }
  .stat .k { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--ink-3); font-weight: 600; }
  .stat .v { font-size: 1.62rem; font-weight: 700; line-height: 1.12; margin-top: 3px;
    font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .stat .d { font-size: 0.68rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }

  /* The histogram is the finding and the filter at once: the shape of it *is*
     the answer to "when were they built", and clicking a bar shows you those. */
  .hist { display: flex; align-items: flex-end; gap: 3px; padding: 8px 22px 0;
    height: 64px; flex: none; }
  .bar { flex: 1; min-width: 0; display: flex; flex-direction: column;
    justify-content: flex-end; align-items: center; height: 100%; cursor: pointer;
    background: none; border: 0; padding: 0; font: inherit; }
  /* Two stacked series, not one bar: the flood-control structures sit under the
     lakes so the boom reads as the two different things it is made of. A 2px
     ground-coloured gap separates the segments. */
  .bar i { display: block; width: 100%; background: var(--c3); border-radius: 2px 2px 0 0;
    transition: opacity 0.12s; min-height: 1px; }
  .bar i.nrcs { background: var(--c1); border-radius: 0;
    border-top: 2px solid var(--ground); }
  .bar:hover i { opacity: 0.75; }
  .bar.peak i { background: var(--accent); }
  .bar.peak i.nrcs { background: #8a6410; }
  .bar.off i { opacity: 0.22; }
  .bar span { font-size: 0.58rem; color: var(--ink-3); margin-top: 4px;
    font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bar.on span { color: var(--ink); font-weight: 700; }
  .histnote { padding: 2px 22px 7px; font-size: 0.64rem; color: var(--ink-3); flex: none; }
  .histnote b { color: var(--ink-2); font-weight: 600; }
  .clear { background: none; border: 1px solid var(--rule); color: var(--ink-2);
    border-radius: 3px; font: inherit; font-size: 0.62rem; padding: 2px 7px;
    margin-left: 8px; cursor: pointer; }
  .clear:hover { border-color: var(--c4); color: var(--ink); }

  .wrap { flex: 1; min-height: 0; position: relative; }
  #map { position: absolute; inset: 0; }

  .panel { position: absolute; left: 16px; bottom: 16px; z-index: 5; background: var(--panel);
    border: 1px solid var(--rule); border-radius: 3px; padding: 9px 12px 10px;
    max-width: 208px;
    /* on a laptop the map is ~450px tall and an uncapped panel runs off the
       bottom of it, taking the dam checkboxes with it */
    max-height: calc(100% - 32px); overflow-y: auto; scrollbar-width: thin; }
  .panel h2 { margin: 0 0 5px; font-size: 0.58rem; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--ink-3); font-weight: 600; }
  .panel h2:not(:first-child) { margin-top: 9px; }
  .lyr { display: flex; align-items: center; gap: 7px; padding: 1px 0; font-size: 0.74rem;
    color: var(--ink-2); cursor: pointer; }
  .lyr input { accent-color: var(--c4); }
  .bases { display: flex; gap: 4px; }
  .bases button { flex: 1; background: var(--panel-2); border: 1px solid var(--rule);
    color: var(--ink-2); font: inherit; font-size: 0.66rem; padding: 4px 2px;
    border-radius: 3px; cursor: pointer; }
  .bases button:hover { color: var(--ink); border-color: var(--c4); }
  .bases button[aria-pressed="true"] { background: var(--c3); border-color: var(--c4);
    color: #fff; font-weight: 600; }

  .key { display: flex; gap: 2px; margin: 2px 0; }
  .key i { height: 9px; flex: 1; display: block; }
  .keylab { display: flex; justify-content: space-between; font-size: 0.58rem;
    color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .sizes { display: flex; align-items: flex-end; gap: 8px; margin-top: 2px; }
  .sizes div { text-align: center; font-size: 0.54rem; color: var(--ink-3); }
  .sizes b { display: block; border-radius: 50%; background: var(--c3);
    margin: 0 auto 2px; }

  /* The caveats are the honest part of this page and they are six lines long,
     which is six lines the map does not get. Collapsed to one by default; the
     reader who wants to know what a dam has to be to qualify for the inventory
     is a reader who will click. */
  footer { flex: none; padding: 7px 22px 10px; font-size: 0.65rem;
    color: var(--ink-3); line-height: 1.55; }
  footer a { color: var(--ink-2); }
  footer summary { cursor: pointer; list-style: none; display: flex; gap: 7px;
    align-items: baseline; white-space: nowrap; overflow: hidden; }
  footer summary::-webkit-details-marker { display: none; }
  footer summary .src { overflow: hidden; text-overflow: ellipsis; }
  footer summary .more { color: var(--c4); font-weight: 600; flex: none; }
  footer summary .more::after { content: " ▾"; }
  footer details[open] summary .more::after { content: " ▴"; }
  footer summary:hover .more { color: var(--c6); }
  footer .notes { margin-top: 7px; max-height: 30vh; overflow-y: auto;
    padding-right: 10px; border-top: 1px solid var(--rule); padding-top: 7px; }
  footer .notes p { margin: 0 0 6px; }
  footer .notes b { color: var(--ink-2); }
  .maplibregl-popup-content { background: var(--panel-2); color: var(--ink);
    border: 1px solid var(--rule); font-size: 0.76rem; padding: 10px 12px;
    line-height: 1.5; }
  .maplibregl-popup-content b { color: var(--c5); }
  .maplibregl-popup-content .yr { color: var(--accent); font-weight: 700; }
  .maplibregl-popup-tip { border-top-color: var(--panel-2) !important; }
  .maplibregl-ctrl-attrib { font-size: 9px; }
  @media (max-width: 700px) {
    .panel { max-width: 168px; left: 10px; bottom: 10px; padding: 9px 10px 10px; }
    header, .stats, .hist, .histnote, footer { padding-left: 12px; padding-right: 12px; }
    .bar span { font-size: 0.5rem; }
    .hist { height: 60px; }
  }
</style>

<header>
  <div class="title">
    <h1>When every lake in Texas was built</h1>
    <a class="home" href="https://geopen.io/">geopen.io</a>
  </div>
  <p class="sub">7,421 dams and 211 reservoirs, with the year each was built —
    and, for the 122 the state gauges, how full they are today.</p>
</header>

<div class="stats" id="stats"></div>
<div class="hist" id="hist"></div>
<div class="histnote" id="histnote"></div>

<div class="wrap">
  <div id="map"></div>
  <div class="panel">
    <h2>Basemap</h2>
    <div class="bases" id="bases"></div>
    <h2>Year completed</h2>
    <div class="key" id="key"></div>
    <div class="keylab" id="keylab"><span>1849</span><span>2024</span></div>
    <h2>Size</h2>
    <div class="sizes" id="sizes"></div>
    <h2>Colour the lakes by</h2>
    <label class="lyr"><input type="radio" name="view" id="v-year" checked> Year impounded</label>
    <label class="lyr"><input type="radio" name="view" id="v-full"> How full it is today</label>
    <div class="key" id="key2"></div>
    <div class="keylab" id="keylab2"><span>Empty</span><span>Full</span></div>
    <h2>Dams</h2>
    <label class="lyr"><input type="checkbox" id="t-dams" checked> Show the 7,421 dam points</label>
    <label class="lyr"><input type="checkbox" id="t-major"> Major reservoirs only</label>
    <label class="lyr"><input type="checkbox" id="t-undated" checked> Undated dams</label>
    <label class="lyr"><input type="checkbox" id="t-nofed"> Hide federal flood control</label>
  </div>
</div>

<footer id="foot">Loading 7,421 dams…</footer>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const E = "https://server.arcgisonline.com/ArcGIS/rest/services";
// Satellite first: these polygons are the real shorelines, so imagery underneath
// shows the reservoir against the country it drowned — and a lake sitting well
// below its shoreline is visible in the picture before any colour says so.
// The dark canvas stays as an option because the ramps were built against it.
const BASES = [
  { id: "sat", label: "Satellite",
    url: `${E}/World_Imagery/MapServer/tile/{z}/{y}/{x}`,
    ref: `${E}/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}`,
    opacity: 1, lakeLine: "#ffffff", fill: { year: 0.8, full: 0.55 },
    damStroke: "#000000" },
  { id: "topo", label: "Terrain",
    url: `${E}/World_Topo_Map/MapServer/tile/{z}/{y}/{x}`,
    ref: null, opacity: 1, lakeLine: "#0a1017", fill: { year: 0.85, full: 0.85 },
    damStroke: "#ffffff" },
  { id: "dark", label: "Dark",
    url: `${E}/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}`,
    ref: `${E}/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}`,
    opacity: 0.62, lakeLine: "#c2e9f4", fill: { year: 0.85, full: 0.85 },
    damStroke: "#0a1017" },
];
let baseKey = "sat";
let viewKey = "year";

const DATA = "/data/texas_lake_ages.geojson";
const LAKES = "/data/texas_reservoirs.geojson";
// proxied: waterdatafortexas.org serves the daily conditions CSV with no CORS
// header, so the browser cannot read it directly
const LEVELS = "/api/reservoirs/texas";
// Fullness is a proportion of a fixed thing, so it gets its own ramp — a dry
// tan through to the same water blue the age ramp ends on. Not diverging: 50%
// full is not a neutral midpoint, it is just half.
const FULL_STOPS = [[0, "#8a6a3f"], [25, "#b09256"], [50, "#5f9ab0"],
                    [75, "#2b83b3"], [100, "#163a55"]];
// 5,000 acre-feet is the Texas Water Development Board's own line between a
// "major" reservoir and everything else.
const MAJOR = 5000;
const STOPS = [
  [1900, "#163a55"], [1930, "#1f5c85"], [1950, "#2b83b3"],
  [1970, "#4aabd6"], [1990, "#86cfe8"], [2010, "#c2e9f4"],
];
const NODATE = "#4a5a66";

document.getElementById("key").innerHTML =
  STOPS.map(([, c]) => `<i style="background:${c}"></i>`).join("");
document.getElementById("key2").innerHTML =
  FULL_STOPS.map(([, c]) => `<i style="background:${c}"></i>`).join("");

// Built at top level, not inside the load handler — a picker that only exists
// once 4 MB of geometry has arrived is a picker that silently renders nothing
// when a fetch fails.
document.getElementById("bases").innerHTML = BASES.map((b) =>
  `<button type="button" data-base="${b.id}" aria-pressed="${b.id === baseKey}"
    >${b.label}</button>`).join("");
document.getElementById("bases").addEventListener("click", (e) => {
  const id = e.target.dataset && e.target.dataset.base;
  const bm = BASES.find((b) => b.id === id);
  if (bm) setBase(bm);
});
document.getElementById("sizes").innerHTML = [[5, "1k af"], [9, "100k"], [15, "1M+"]]
  .map(([r, l]) => `<div><b style="width:${r * 2}px;height:${r * 2}px"></b>${l}</div>`).join("");

const fmt = (n) => (n == null || isNaN(n)) ? "—" : Math.round(n).toLocaleString();

// Two ways to colour a lake, sharing one layer. `year` uses the same ramp as the
// dam points so the two layers read as one map; `pct` uses the fullness ramp.
// An ungauged lake is not 0% full, it is unmeasured, and gets the grey the
// undated dams use rather than the dry end of the ramp.
function lakeColour(mode) {
  if (mode === "full") {
    return ["case", ["==", ["get", "pct"], null], NODATE,
      ["interpolate", ["linear"], ["get", "pct"],
        ...FULL_STOPS.flatMap(([v, c]) => [v, c])]];
  }
  return ["case", ["!", ["has", "year"]], NODATE,
    ["interpolate", ["linear"], ["get", "year"],
      ...STOPS.flatMap(([y, c]) => [y, c])]];
}

/** Repaint the lakes for the current basemap AND the current view.
 *
 *  The two interact, which is why one function owns both. A reservoir polygon
 *  is its *full* conservation pool, so a lake at 38% shows as water in the
 *  middle with a ring of dry ground inside the same outline. On satellite that
 *  ring is visible in the imagery — the fullness view drops to 55% opacity so
 *  the picture corroborates the number, while the year view stays at 80%
 *  because there the fill is the only thing carrying data. 55% rather than
 *  lower: below about half, the tint stops reading as an encoding at all and
 *  the legend starts describing a colour nobody can see.
 *
 *  On the flat basemaps there is nothing underneath worth seeing through, so
 *  both views stay opaque.
 */
function paintLakes() {
  const bm = BASES.find((b) => b.id === baseKey);
  if (!map.getLayer("lakes")) return;
  map.setPaintProperty("lakes", "fill-color", lakeColour(viewKey));
  map.setPaintProperty("lakes", "fill-opacity", bm.fill[viewKey]);
  map.setPaintProperty("lakes-line", "line-color", bm.lakeLine);
}

/** Swap the imagery and re-tune every mark that sits on it. */
function setBase(bm) {
  baseKey = bm.id;
  map.getSource("base").setTiles([bm.url]);
  map.setPaintProperty("base", "raster-opacity", bm.opacity);
  if (bm.ref) map.getSource("ref").setTiles([bm.ref]);
  if (map.getLayer("ref")) {
    map.setLayoutProperty("ref", "visibility", bm.ref ? "visible" : "none");
  }
  if (map.getLayer("dams")) {
    map.setPaintProperty("dams", "circle-stroke-color", bm.damStroke);
  }
  paintLakes();
  document.querySelectorAll("#bases button").forEach((x) =>
    x.setAttribute("aria-pressed", String(x.dataset.base === bm.id)));
}

function lakePopup() {
  const pop = new maplibregl.Popup({ closeButton: false, maxWidth: "300px" });
  map.on("mousemove", "lakes", (e) => {
    // a dam point sitting on the lake wins the hover; its popup is more specific.
    // guarded because queryRenderedFeatures throws on a layer that isn't there,
    // and the lakes draw first — if the dam fetch failed there is no "dams"
    if (map.getLayer("dams")
        && map.queryRenderedFeatures(e.point, { layers: ["dams"] }).length) return;
    map.getCanvas().style.cursor = "pointer";
    const p = e.features[0].properties;
    const bits = [];
    if (p.pct != null) {
      bits.push(`<span class="yr">${p.pct}% full</span> today` +
        (p.asof ? ` <span style="color:#6b8496">(${p.asof})</span>` : "") +
        (p.vol ? `<br>${fmt(p.vol)} of ${fmt(p.cap_now)} acre-feet` : ""));
    } else {
      bits.push(`<span style="color:#6b8496">Not gauged by the state — no daily level</span>`);
    }
    pop.setLngLat(e.lngLat).setHTML(
      `<b>${p.name}</b>${p.alias ? `<br><span style="color:#6b8496">also ${p.alias}</span>` : ""}<br>` +
      `<span class="yr">${p.year ? `Impounded ${p.year}` : "Impoundment date not recorded"}</span>` +
      `${p.offchannel ? " · off-channel" : ""}<br>` +
      bits.join("") + "<br>" +
      `<span style="color:#6b8496">${p.uses || "purpose not stated"}</span>`
    ).addTo(map);
  });
  map.on("mouseleave", "lakes", () => { map.getCanvas().style.cursor = ""; pop.remove(); });
}


const map = new maplibregl.Map({
  container: "map",
  style: {
    version: 8,
    glyphs: "https://protomaps.github.io/basemaps-assets/fonts/{fontstack}/{range}.pbf",
    sources: {
      base: { type: "raster", tileSize: 256, maxzoom: 19, attribution: "© Esri",
        tiles: [BASES[0].url] },
      ref: { type: "raster", tileSize: 256, maxzoom: 19, tiles: [BASES[0].ref] },
    },
    layers: [{ id: "base", type: "raster", source: "base",
      paint: { "raster-opacity": BASES[0].opacity } }],
  },
  center: [-99.3, 31.3], zoom: 5.05, attributionControl: { compact: true },
});
map.addControl(new maplibregl.NavigationControl(), "top-right");
// A top-level const never lands on window, and `window.map` is already taken by
// the <div id="map">, so anything driving this page from the console needs a
// handle of its own.
window.__map = map;

// ---- filter state: a decade from the histogram, plus the two checkboxes ----
let pickedDecade = null;
const wantMajor = () => document.getElementById("t-major").checked;
const wantUndated = () => document.getElementById("t-undated").checked;
const hideFed = () => document.getElementById("t-nofed").checked;

function applyFilter() {
  const f = ["all"];
  if (pickedDecade != null) f.push(["==", ["get", "decade"], pickedDecade]);
  if (wantMajor()) f.push(["==", ["get", "major"], true]);
  // an undated dam has decade null; MapLibre can't compare null, so test the year
  if (!wantUndated()) f.push(["has", "year"]);
  if (hideFed()) f.push(["==", ["get", "nrcs"], false]);
  if (map.getLayer("dams")) map.setFilter("dams", f.length > 1 ? f : null);
  // the ring layer keeps its own major test no matter what the checkbox says —
  // reusing `f` here would ring every dam whenever the box was unticked
  if (map.getLayer("dams-major")) {
    map.setFilter("dams-major", ["all", ["==", ["get", "major"], true], ...f.slice(1)]);
  }
  document.querySelectorAll(".bar").forEach((b) => {
    const d = Number(b.dataset.decade);
    b.classList.toggle("on", pickedDecade === d);
    b.classList.toggle("off", pickedDecade != null && pickedDecade !== d);
  });
  note();
}

function note() {
  const el = document.getElementById("histnote");
  const bits = [];
  if (pickedDecade != null) {
    const n = window.__hist.get(pickedDecade) || 0;
    const fed = window.__histN.get(pickedDecade) || 0;
    bits.push(`Showing the <b>${fmt(n)}</b> dams completed in the <b>${pickedDecade}s</b>` +
      (fed ? ` — <b>${fmt(fed)}</b> of them federal flood control (the darker base of the bar)` : "") +
      `<button class="clear" onclick="pickDecade(null)">show all decades</button>`);
  } else {
    bits.push("Each bar is a decade; the darker base is federal flood control rather than " +
      "lakes. <b>Click a bar</b> to show only the dams finished then.");
  }
  el.innerHTML = bits.join(" ");
}

// clicking the selected bar again clears it, so the toggle needs no outside state
window.pickDecade = (d) => { pickedDecade = (pickedDecade === d) ? null : d; applyFilter(); };


/* Phones have no mousemove, so a hover-only popup leaves a tap doing nothing.
   Rather than duplicating each handler, map.on is wrapped once: every
   ("mousemove", layer, fn) registration also registers the identical fn on
   "click". Desktop keeps hover; touch gets the same popup on tap, and
   MapLibre's default closeOnClick dismisses it. */
(function () {
  const _on = map.on.bind(map);
  map.on = function (type, layer, fn) {
    _on(type, layer, fn);
    if (type === "mousemove" && typeof layer === "string" && typeof fn === "function") {
      _on("click", layer, fn);
    }
    return map;
  };
})();

map.on("load", async () => {
  let gj;
  try {
    const r = await fetch(DATA);
    if (!r.ok) throw new Error(r.status);
    gj = await r.json();
  } catch (e) {
    document.getElementById("foot").textContent = "Could not load the dam data.";
    return;
  }
  const P = gj.features.map((f) => f.properties);

  // ---- the lakes themselves, under the dam points ----
  let levels = null;
  try {
    const [lg, lv] = await Promise.all([
      fetch(LAKES).then((r) => r.json()),
      fetch(LEVELS).then((r) => r.json()).catch(() => null),
    ]);
    levels = lv && lv.ok ? lv : null;
    // fold today's reading into each polygon, so MapLibre can style on it
    for (const f of lg.features) {
      const k = f.properties.live;
      const r = (levels && k) ? levels.reservoirs[k] : null;
      f.properties.pct = (r && r.percent_full != null) ? r.percent_full : null;
      f.properties.vol = r ? r.volume_af : null;
      f.properties.cap_now = r ? r.capacity_af : null;
      f.properties.elev = r ? r.elevation_ft : null;
      f.properties.asof = r ? r.date : null;
    }
    window.__levels = levels;
    const b0 = BASES[0];
    map.addSource("lakes", { type: "geojson", data: lg });
    map.addLayer({ id: "lakes", type: "fill", source: "lakes",
      paint: { "fill-color": lakeColour("year"), "fill-opacity": b0.fill.year } });
    map.addLayer({ id: "lakes-line", type: "line", source: "lakes",
      paint: { "line-color": b0.lakeLine, "line-opacity": 0.75,
        // a hairline at statewide zoom is most of what makes a small reservoir
        // findable at all, so it does not thin out with the rest of the map
        "line-width": ["interpolate", ["linear"], ["zoom"], 5, 0.9, 10, 1.4] } });
    lakePopup();
  } catch (e) { /* the dam points still carry the page */ }

  map.addSource("dams", { type: "geojson", data: gj });

  const colour = ["case", ["!", ["has", "year"]], NODATE,
    ["interpolate", ["linear"], ["get", "year"], ...STOPS.flatMap(([y, c]) => [y, c])]];
  // area, not radius, tracks storage — so a reservoir ten times bigger looks
  // ten times bigger rather than a hundred.
  //
  // Held deliberately small at statewide zoom. 7,421 points over Texas is a
  // solid mat that hides the lake polygons underneath it, and the lakes are
  // what the page is about; the swarm still reads as density at this size.
  // They grow into the primary mark as you zoom to where individual dams matter.
  const radius = ["interpolate", ["linear"], ["zoom"],
    4, ["interpolate", ["linear"], ["sqrt", ["get", "storage_af"]], 0, 1.1, 300, 2.4, 2120, 6],
    9, ["interpolate", ["linear"], ["sqrt", ["get", "storage_af"]], 0, 3.5, 300, 11, 2120, 34]];

  map.addLayer({ id: "dams", type: "circle", source: "dams",
    paint: { "circle-radius": radius, "circle-color": colour,
      // translucent statewide so the water shows through the mat of points,
      // solid once you are close enough to be reading individual dams
      "circle-opacity": ["interpolate", ["linear"], ["zoom"], 5, 0.5, 8.5, 0.85],
      "circle-stroke-color": BASES[0].damStroke,
      "circle-stroke-width": ["interpolate", ["linear"], ["zoom"], 6, 0, 8, 0.6] } });
  // A ring marks the dams whose reservoir is major. It only earns its ink once
  // the polygons are too small to do the job — at statewide zoom the lake shape
  // already says which dams hold real water, and 202 rings just add noise.
  map.addLayer({ id: "dams-major", type: "circle", source: "dams",
    filter: ["==", ["get", "major"], true],
    paint: { "circle-radius": radius, "circle-color": "rgba(0,0,0,0)",
      "circle-stroke-color": "#e9f1f6",
      "circle-stroke-width": ["interpolate", ["linear"], ["zoom"], 6.5, 0, 8, 1] } });

  map.addLayer({ id: "ref", type: "raster", source: "ref", paint: { "raster-opacity": 0.8 } });
  setBase(BASES[0]);

  const pop = new maplibregl.Popup({ closeButton: false, maxWidth: "290px" });
  map.on("mousemove", "dams", (e) => {
    map.getCanvas().style.cursor = "pointer";
    const p = e.features[0].properties;
    const line = [];
    if (p.storage_af > 0) line.push(`${fmt(p.storage_af)} acre-feet`);
    if (p.surface_ac > 0) line.push(`${fmt(p.surface_ac)} surface acres`);
    if (p.height_ft > 0) line.push(`${fmt(p.height_ft)} ft high`);
    pop.setLngLat(e.lngLat).setHTML(
      `<b>${p.name}</b>${p.also ? `<br><span style="color:#6b8496">also ${p.also}</span>` : ""}<br>` +
      `<span class="yr">${p.year ? `Completed ${p.year}` : "Completion year not recorded"}</span>` +
      `${p.modified ? ` · modified ${p.modified}` : ""}<br>` +
      `${p.county} County${p.river ? ` · ${p.river}` : ""}<br>` +
      (line.length ? line.join(" · ") + "<br>" : "") +
      `${p.purpose || "purpose unstated"}${p.type ? ` · ${p.type.toLowerCase()} dam` : ""}<br>` +
      `<span style="color:#6b8496">${p.owner || "owner unstated"}` +
      `${p.condition ? ` · rated ${p.condition.toLowerCase()}` : ""}` +
      `${p.authority ? `<br>Built under the ${p.authority}` : ""}</span>`
    ).addTo(map);
  });
  map.on("mouseleave", "dams", () => { map.getCanvas().style.cursor = ""; pop.remove(); });

  // ---- histogram, built from what is actually drawn ----
  const hist = new Map(), histN = new Map();
  for (const p of P) if (p.decade != null && p.decade >= 1880) {
    hist.set(p.decade, (hist.get(p.decade) || 0) + 1);
    if (p.nrcs) histN.set(p.decade, (histN.get(p.decade) || 0) + 1);
  }
  window.__hist = hist; window.__histN = histN;
  const decades = [...hist.keys()].sort((a, b) => a - b);
  const peak = decades.reduce((a, d) => hist.get(d) > hist.get(a) ? d : a, decades[0]);
  const mx = hist.get(peak);
  document.getElementById("hist").innerHTML = decades.map((d) => {
    const n = hist.get(d), fed = histN.get(d) || 0;
    return `<button class="bar${d === peak ? " peak" : ""}" data-decade="${d}"
      title="${fmt(n)} dams completed in the ${d}s — ${fmt(fed)} of them federal flood control"
      onclick="pickDecade(${d})">
      <i style="height:${((n - fed) / mx * 100).toFixed(1)}%"></i>
      <i class="nrcs" style="height:${(fed / mx * 100).toFixed(1)}%"></i>
      <span>${d === decades[0] || d % 20 === 0 ? `'${String(d).slice(2)}` : "&nbsp;"}</span>
    </button>`;
  }).join("");

  // ---- the numbers ----
  const dated = P.filter((p) => p.year);
  const yrs = dated.map((p) => p.year).sort((a, b) => a - b);
  const median = yrs[Math.floor(yrs.length / 2)];
  const majors = P.filter((p) => p.major);
  const since90 = majors.filter((p) => p.year >= 1990).length;
  const boom = decades.filter((d) => d >= 1950 && d <= 1979)
    .reduce((a, d) => a + hist.get(d), 0);
  const fed = P.filter((p) => p.nrcs).length;

  document.getElementById("stats").innerHTML = [
    ["Dams on the record", fmt(P.length), `${fmt(dated.length)} with a completion year`],
    ["Median completion", median, `${new Date().getFullYear() - median} years ago`],
    ["Built 1950–1979", fmt(boom), `${Math.round(boom / dated.length * 100)}% of every dated dam`],
    ["Peak decade", `${peak}s`, `${fmt(mx)} dams — more than any other`],
    ["Federal flood control", fmt(fed), `${Math.round(fed / P.length * 100)}% of the total, median 109 af`],
    ["Major reservoirs", fmt(majors.length), `holding 5,000+ acre-feet`],
    ["Major, built since 1990", since90, "in the last 36 years"],
    ...(levels && levels.statewide ? [[
      "Texas reservoirs today",
      `${levels.statewide.percent_full}% full`,
      `${fmt(levels.statewide.volume_af)} of ${fmt(levels.statewide.capacity_af)} af` +
      `${levels.date ? ` · ${levels.date}` : ""}`,
    ]] : []),
  ].map(([k, v, d]) =>
    `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div>
     <div class="d">${d}</div></div>`).join("");

  for (const id of ["t-major", "t-undated", "t-nofed"]) {
    document.getElementById(id).addEventListener("change", applyFilter);
  }
  document.getElementById("t-dams").addEventListener("change", (e) => {
    for (const id of ["dams", "dams-major"]) {
      if (map.getLayer(id)) {
        map.setLayoutProperty(id, "visibility", e.target.checked ? "visible" : "none");
      }
    }
  });
  for (const [id, mode] of [["v-year", "year"], ["v-full", "full"]]) {
    document.getElementById(id).addEventListener("change", () => {
      viewKey = mode;
      paintLakes();
      // dim whichever legend isn't in play, so two ramps never both read as live
      for (const [el, on] of [["key", mode === "year"], ["keylab", mode === "year"],
                              ["key2", mode === "full"], ["keylab2", mode === "full"]]) {
        document.getElementById(el).style.opacity = on ? "1" : "0.35";
      }
    });
  }
  document.getElementById("key2").style.opacity = "0.35";
  document.getElementById("keylab2").style.opacity = "0.35";
  applyFilter();

  const A = (href, text) =>
    `<a href="${href}" target="_blank" rel="noopener">${text}</a>`;
  document.getElementById("foot").innerHTML = `<details><summary>
      <span class="src">Lakes and dates from ${A("https://www.twdb.texas.gov/", "TWDB")} ·
        today's levels from ${A("https://www.waterdatafortexas.org/reservoirs/statewide",
          "Water Data for Texas")}${levels && levels.date ? `, ${levels.date}` : ""} ·
        dams from the ${A("https://nid.sec.usace.army.mil/", "National Inventory of Dams")} ·
        free to download at ${A("https://geopen.io/", "geopen.io")}</span>
      <span class="more">What's in this, and what isn't</span>
    </summary>
    <div class="notes">
      <p><b>The lakes.</b> 211 reservoirs from the Texas Water Development Board,
        209 of them dated to the month. Where TWDB and the Corps both date a
        reservoir they agree exactly 74% of the time and within two years 92% of
        the time, matched on dam location rather than name — the one-year gaps
        are a dam finished in one year and filled the next.</p>
      <p><b>The levels.</b> Read fresh each time this page loads. The state
        gauges 122 reservoirs daily; the other 89 are grey rather than empty,
        because ungauged is not the same as dry. Flood-control-only pools like
        Addicks and Barker are meant to sit empty and stay out of the statewide
        figure.</p>
      <p><b>The dams.</b> Every one the US Army Corps of Engineers lists in
        Texas. A dam qualifies at 25ft high storing 15 acre-feet, or 50 acre-feet
        at 6ft, or at any size if it threatens life below it — so this is every
        lake in Texas and none of the stock tanks. Texas has one natural lake of
        consequence, Caddo, and it has had a dam since 1914.</p>
      <p><b>Two things that will look like errors.</b> Large reservoirs appear
        more than once where a main dam has saddle dikes, and the counts above
        treat each structure separately, the way the inventory does. And the
        inventory files a dam by where the dam stands rather than where its water
        sits, so a few border reservoirs are missing — Lake Texoma most of all,
        whose Denison Dam (1944, 2.6 million acre-feet) is filed under
        Oklahoma.</p>
    </div></details>`;
});
</script>
