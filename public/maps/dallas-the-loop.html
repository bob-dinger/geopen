<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Loop — Dallas's 71-mile trail ring, and how much of it exists</title>
<meta name="description" content="The Loop is a planned 71-mile trail circling central Dallas. 46.7 miles are built. This is which parts, and which parts are still a line on a map.">
<link rel="canonical" href="https://geopen.io/maps/dallas-the-loop.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="geopen.io">
<meta property="og:title" content="The Loop — Dallas's 71-mile trail ring">
<meta property="og:description" content="65% built. The rest is programmed or proposed.">
<meta property="og:url" content="https://geopen.io/maps/dallas-the-loop.html">
<meta property="og:image" content="https://geopen.io/maps/dallas-the-loop-card.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://geopen.io/maps/dallas-the-loop-card.png">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root {
    --ground: #10140f; --panel: #181d16; --panel-2: #222920;
    --rule: rgba(220,240,205,0.15);
    --ink: #eef4e8; --ink-2: #a8b89c; --ink-3: #78876d;
    --signal: #8fd14f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ground); color: var(--ink);
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  .wrap { flex: 1; min-height: 0; position: relative; }
  #map { position: absolute; inset: 0; }
  .titlecard { position: absolute; left: 16px; top: 16px; z-index: 6; max-width: 320px;
    background: var(--panel); border: 1px solid var(--rule); border-radius: 3px;
    padding: 11px 14px 12px; }
  .titlecard h1 { margin: 0; font-size: 0.98rem; font-weight: 700; line-height: 1.25;
    letter-spacing: -0.01em; text-wrap: balance; }
  .titlecard p { margin: 5px 0 0; font-size: 0.71rem; color: var(--ink-3); line-height: 1.5; }
  .titlecard a { color: var(--ink-2); text-decoration: none; }
  .titlecard a:hover { color: var(--signal); }
  .panel { position: absolute; left: 16px; bottom: 16px; z-index: 5; background: var(--panel);
    border: 1px solid var(--rule); border-radius: 3px; padding: 10px 12px 11px;
    max-width: 226px; max-height: calc(100% - 32px); overflow-y: auto; }
  .state { font-size: 0.82rem; font-weight: 700; line-height: 1.3; margin-bottom: 8px; }
  .state b { color: var(--signal); font-variant-numeric: tabular-nums; }
  .state span { display: block; font-size: 0.7rem; font-weight: 400; color: var(--ink-2);
    margin-top: 3px; }
  h2 { margin: 10px 0 5px; font-size: 0.58rem; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--ink-3); font-weight: 600; }
  h2:first-of-type { margin-top: 0; }
  .row { display: flex; align-items: center; gap: 7px; padding: 3px 5px; width: 100%;
    border: 0; background: none; font: inherit; font-size: 0.69rem; color: var(--ink-2);
    cursor: pointer; border-radius: 3px; text-align: left; }
  .row i { width: 16px; height: 3px; border-radius: 2px; flex: none; }
  .row b { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 600; }
  .row:hover { color: var(--ink); background: var(--panel-2); }
  .row.on { color: var(--signal); font-weight: 700; background: var(--panel-2);
    box-shadow: inset 0 0 0 1px var(--signal); }
  .hint { margin: 5px 0 0; font-size: 0.58rem; color: var(--ink-3); line-height: 1.45; }
  .clear { background: none; border: 1px solid var(--rule); color: var(--signal);
    border-radius: 3px; font: inherit; font-size: 0.62rem; padding: 3px 8px; cursor: pointer; }
  .bases { display: flex; gap: 4px; flex-wrap: wrap; }
  .bases button { flex: 1 1 44%; background: var(--panel-2); border: 1px solid var(--rule);
    color: var(--ink-2); font: inherit; font-size: 0.65rem; padding: 4px 2px;
    border-radius: 3px; cursor: pointer; }
  .bases button[aria-pressed="true"] { background: var(--signal); border-color: var(--signal);
    color: #16210b; font-weight: 700; }
  footer { flex: none; padding: 7px 20px 9px; font-size: 0.64rem; color: var(--ink-3);
    line-height: 1.5; }
  footer a { color: var(--ink-2); }
  .maplibregl-popup-content { background: var(--panel-2); color: var(--ink);
    border: 1px solid var(--rule); font-size: 0.76rem; padding: 10px 12px; line-height: 1.5; }
  .maplibregl-popup-content b { color: var(--signal); }
  .maplibregl-popup-tip { border-top-color: var(--panel-2) !important; }
  @media (max-width: 700px) {
    .titlecard { left: 10px; top: 10px; max-width: calc(100% - 20px); }
    .panel { left: 10px; bottom: 10px; max-width: 176px; }
  }
</style>

<div class="wrap">
  <div id="map"></div>
  <div class="titlecard">
    <h1>The Loop, and how much of it exists</h1>
    <p>A 71-mile trail ring around central Dallas, drawn by status.
      <a href="https://geopen.io/">geopen.io</a></p>
  </div>
  <div class="panel">
    <div class="state" id="state"></div>
    <h2>Status</h2>
    <div id="legend"></div>
    <p class="hint" id="hint"></p>
    <h2>Basemap</h2>
    <div class="bases" id="bases"></div>
  </div>
</div>
<footer id="foot">Loading…</footer>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const E = "https://server.arcgisonline.com/ArcGIS/rest/services";
const BASES = [
  { id: "sat", label: "Satellite", url: `${E}/World_Imagery/MapServer/tile/{z}/{y}/{x}`,
    ref: `${E}/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}`, opacity: 1 },
  { id: "dark", label: "Dark", url: `${E}/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}`,
    ref: `${E}/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}`, opacity: 0.6 },
  { id: "light", label: "Light", url: `${E}/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}`,
    ref: `${E}/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}`, opacity: 1 },
  { id: "topo", label: "Streets", url: `${E}/World_Street_Map/MapServer/tile/{z}/{y}/{x}`,
    ref: null, opacity: 1 },
];
let baseKey = "sat", picked = null;
// Colour carries the status; weight carries whether it exists yet.
const STATUS = [
  ["EXISTING", "Built and open", "#8fd14f"],
  ["PROGRAMMED", "Funded, not built", "#ffc94a"],
  ["PROPOSED", "Proposed only", "#ff7a5c"],
  ["SIDEWALK/STREET", "On-street gap", "#9aa7b3"],
];
const num = (v) => (v == null ? "—" : v.toLocaleString());

document.getElementById("bases").innerHTML = BASES.map((b) =>
  `<button type="button" data-base="${b.id}" aria-pressed="${b.id===baseKey}">${b.label}</button>`).join("");
document.getElementById("bases").addEventListener("click", (e) => {
  const bm = BASES.find((b) => b.id === (e.target.dataset && e.target.dataset.base));
  if (bm) setBase(bm);
});

const map = new maplibregl.Map({
  container: "map",
  style: { version: 8,
    glyphs: "https://protomaps.github.io/basemaps-assets/fonts/{fontstack}/{range}.pbf",
    sources: {
      base: { type: "raster", tileSize: 256, maxzoom: 19, attribution: "© Esri", tiles: [BASES[0].url] },
      ref: { type: "raster", tileSize: 256, maxzoom: 19, tiles: [BASES[0].ref] },
    },
    layers: [{ id: "base", type: "raster", source: "base", paint: { "raster-opacity": 1 } }],
  },
  center: [-96.79, 32.78], zoom: 10.4, attributionControl: { compact: true },
});
map.addControl(new maplibregl.NavigationControl(), "top-right");
map.addControl(new maplibregl.ScaleControl({ unit: "imperial" }), "bottom-right");
window.__map = map;

function setBase(bm) {
  baseKey = bm.id;
  map.getSource("base").setTiles([bm.url]);
  map.setPaintProperty("base", "raster-opacity", bm.opacity);
  if (bm.ref) map.getSource("ref").setTiles([bm.ref]);
  if (map.getLayer("ref")) map.setLayoutProperty("ref", "visibility", bm.ref ? "visible" : "none");
  document.querySelectorAll("#bases button").forEach((x) =>
    x.setAttribute("aria-pressed", String(x.dataset.base === bm.id)));
}
function applyFilter() {
  const f = picked ? ["==", ["get", "status"], picked] : null;
  for (const id of ["trail-case", "trail"]) {
    if (map.getLayer(id)) map.setFilter(id, f);
  }
  document.querySelectorAll(".row").forEach((r) => r.classList.toggle("on", picked === r.dataset.k));
  state();
}
window.pick = (k) => { picked = picked === k ? null : k; applyFilter(); };
window.clearPick = () => { picked = null; applyFilter(); };

let S = null;
function state() {
  if (!S) return;
  const sel = picked ? S.by_status[picked] : null;
  const lab = picked ? (STATUS.find(([k]) => k === picked) || [, picked])[1] : null;
  document.getElementById("state").innerHTML = sel
    ? `<b>${sel.miles}</b> miles ${lab.toLowerCase()}<span>${sel.n} segments</span>`
    : `<b>${S.built_pct}%</b> of The Loop is built` +
      `<span>${S.built_miles} of ${S.total_miles} miles, across ${S.segments} segments</span>`;
  document.getElementById("hint").innerHTML = picked
    ? `<button class="clear" onclick="clearPick()">show the whole loop</button>`
    : "Built segments are drawn heavier. Click a status to isolate it.";
}

map.on("load", () => {
  Promise.all([
    fetch("/data/dallas_the_loop.geojson").then((r) => r.json()),
    fetch("/data/dallas_the_loop_stats.json").then((r) => r.json()),
  ]).then(([gj, s]) => {
    S = s;
    map.addSource("loop", { type: "geojson", data: gj });
    const colour = ["match", ["get", "status"], ...STATUS.flatMap(([k, , c]) => [k, c]), "#9aa7b3"];
    // a dark casing under the line so it reads on satellite as well as on canvas
    map.addLayer({ id: "trail-case", type: "line", source: "loop",
      layout: { "line-cap": "round", "line-join": "round" },
      paint: { "line-color": "#10140f",
        "line-width": ["interpolate", ["linear"], ["zoom"],
          10, ["case", ["==", ["get", "status"], "EXISTING"], 5, 3.6],
          15, ["case", ["==", ["get", "status"], "EXISTING"], 11, 7.5]],
        "line-opacity": 0.5 } });
    // One solid line for everything. Built vs unbuilt is carried by weight and
    // opacity rather than a dash pattern — the colours already say which status
    // a segment is, and dashes on a trail map read as a footpath convention
    // rather than as "not yet".
    const built = ["==", ["get", "status"], "EXISTING"];
    map.addLayer({ id: "trail", type: "line", source: "loop",
      layout: { "line-cap": "round", "line-join": "round" },
      paint: { "line-color": colour,
        "line-width": ["interpolate", ["linear"], ["zoom"],
          10, ["case", built, 2.8, 1.8], 15, ["case", built, 7, 4.5]],
        "line-opacity": ["case", built, 1, 0.72] } });
    map.addLayer({ id: "ref", type: "raster", source: "ref", paint: { "raster-opacity": 0.85 } });
    setBase(BASES[0]);

    document.getElementById("legend").innerHTML = STATUS
      .filter(([k]) => s.by_status[k])
      .map(([k, lab, col]) => `<button class="row" data-k="${k}" onclick="pick('${k}')">
        <i style="background:${col};height:${k==="EXISTING"?4:2}px"></i><span>${lab}</span>
        <b>${s.by_status[k].miles} mi</b></button>`).join("");
    state();

    const pop = new maplibregl.Popup({ closeButton: false, maxWidth: "270px" });
    {
      map.on("mousemove", "trail", (e) => {
        map.getCanvas().style.cursor = "pointer";
        const p = e.features[0].properties;
        const lab = (STATUS.find(([k]) => k === p.status) || [, p.status])[1];
        pop.setLngLat(e.lngLat).setHTML(
          `<b>${p.name}</b><br>${lab}<br>` +
          `${p.miles ? `${p.miles} miles` : ""}${p.width ? ` · ${p.width} wide` : ""}` +
          `${p.surface ? ` · ${p.surface.toLowerCase()}` : ""}`
        ).addTo(map);
      });
      map.on("mouseleave", "trail", () => { map.getCanvas().style.cursor = ""; pop.remove(); });
    }
  });
});

document.getElementById("foot").innerHTML =
  `Trail alignments and status from <a href="https://www.dallasparks.org/" target="_blank" rel="noopener">Dallas Park &amp; Recreation</a>. ` +
  `<b>Programmed</b> means funded and scheduled; <b>proposed</b> means drawn but not funded — so the dashed miles are not equally likely to exist. ` +
  `Status is as published and a segment can sit in one category for years. ` +
  `Free to download at <a href="https://geopen.io/">geopen.io</a>.`;
</script>
